name: Android CI and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}
      version_code: ${{ steps.app_version.outputs.version_code }}
      release_tag: ${{ steps.app_version.outputs.release_tag }}
      apk_name: ${{ steps.app_version.outputs.apk_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Repair progressive onboarding before build
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_MESSAGE" == *"fix: isolate progressive onboarding from provider lock"* ]]; then
            echo "Progressive onboarding source fix is already committed."
            exit 0
          fi
          python3 tools/repair_progressive_onboarding.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/src/main/java/com/streamvault/data/sync/SyncManager.kt data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt tools/repair_progressive_onboarding.py
          git rm -f .github/workflows/one-shot-repair.yml .github/workflows/repair-now.yml .github/workflows/repair-final.yml 2>/dev/null || true
          git commit -m 'fix: isolate progressive onboarding from provider lock'
          git push

      - name: Restore app lint baseline for CI
        shell: bash
        run: |
          BASELINE_COMMIT=97e5e49fd4afc4147d435d98e87741a6cec50b8f
          git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          git show "$BASELINE_COMMIT:app/lint-baseline.xml" > app/lint-baseline.xml
          test -s app/lint-baseline.xml
          echo "Restored app lint baseline from $BASELINE_COMMIT"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then exit 1; fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=EliteStocks.TV_${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional signing files
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            printf '%s\n' 'storeFile=keystore/release.jks' "storePassword=$RELEASE_STORE_PASSWORD" "keyAlias=$RELEASE_KEY_ALIAS" "keyPassword=$RELEASE_KEY_PASSWORD" > keystore.properties
          fi

      - name: Restore CI signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: elitestocks-tv-ci-signing-v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply final polish
        shell: bash
        run: python3 tools/final_polish.py

      - name: Clean obsolete resources before lint
        shell: bash
        run: |
          python3 tools/lint_cleanup.py
          test -f app/src/main/res/mipmap-mdpi/ic_launcher_vault.png

      - name: Normalize internal source paths in tests
        shell: bash
        run: |
          find data/src/test app/src/test -type f -name '*.kt' -print0 2>/dev/null | xargs -0 -r sed -i 's#com/EliteStocks TV#com/streamvault#g'

      - name: Verify player/icon polish was applied
        shell: bash
        run: |
          grep -q 'android:icon="@mipmap/ic_launcher_vault"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_vault"' app/src/main/AndroidManifest.xml
          grep -q 'android:label="@string/app_name"' app/src/main/AndroidManifest.xml
          grep -q '<string name="app_name">EliteStocks TV</string>' app/src/main/res/values/strings.xml
          grep -q 'Icons.Default.Pause' app/src/main/java/com/streamvault/app/ui/screens/player/overlay/PlayerControlsChrome.kt
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_vault.xml
          test -f app/src/main/res/drawable/elitestocks_tv_logo.png

      - name: Test CI helper scripts
        shell: bash
        run: for test_script in tools/tests/*-test.sh; do bash "$test_script"; done

      - name: Run unit tests, lint, and coverage
        run: ./gradlew --console=plain testDebugUnitTest :app:lintDebug :data:lintDebug :player:lintDebug verifyLintBaseline koverXmlReportCi koverHtmlReportCi

      - name: Print lint failures
        if: always()
        shell: bash
        run: |
          for report in app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt data/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt player/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; do
            if [ -f "$report" ]; then cat "$report"; fi
          done

      - name: Compile instrumentation release gates
        run: ./gradlew --console=plain :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest

      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          if ! unzip -l "$APK_PATH" | grep -qE 'META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
            mkdir -p "$HOME/.android"
            if [ ! -f "$DEBUG_KEYSTORE" ]; then keytool -genkeypair -v -keystore "$DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'; fi
            "$APKSIGNER" sign --ks "$DEBUG_KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK_PATH"
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Prepare release artifact
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" "dist/${{ steps.app_version.outputs.apk_name }}"
          cp "$APK_PATH" dist/EliteStocks.TV.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            dist/${{ steps.app_version.outputs.apk_name }}
            dist/EliteStocks.TV.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            data/build/reports/tests/
            domain/build/reports/tests/
            player/build/reports/tests/
            app/build/reports/lint-results-debug.*
            data/build/reports/lint-results-debug.*
            player/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: build/reports/kover/

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.app_version.outputs.version_name }}"
          TAG="${{ steps.app_version.outputs.release_tag }}"
          APK_VERSIONED="dist/${{ steps.app_version.outputs.apk_name }}"
          APK_LATEST="dist/EliteStocks.TV.apk"
          NOTES=$(awk -v ver="$VERSION" '$0 ~ ("^## \\[" ver "\\]") || $0 ~ ("^## " ver " ") { p=1; next } $0 ~ "^## " && p { p=0 } p { print }' docs/CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "EliteStocks TV $VERSION" --notes "$NOTES" --latest
            gh release upload "$TAG" "$APK_VERSIONED" "$APK_LATEST" --clobber
          else
            gh release create "$TAG" "$APK_VERSIONED" "$APK_LATEST" --title "EliteStocks TV $VERSION" --notes "$NOTES" --latest
          fi
