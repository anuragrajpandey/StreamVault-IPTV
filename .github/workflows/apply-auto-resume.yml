name: Apply Automatic VOD Resume

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Convert VOD resume prompt to automatic resume
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/streamvault/app/ui/screens/player/PlayerViewModel.kt")
          text = path.read_text(encoding="utf-8")

          old = '''                // Check for resume position after the player is fully prepared (VOD only).
                // Doing this after preparePlayer ensures pause() acts on the live player instance,
                // not a stale one that may have already been replaced by prepareInternal().
                if (showResumePrompt && currentContentType != ContentType.LIVE && currentContentId != -1L && currentProviderId != -1L) {
                    val history = playbackHistoryCoordinator.getPlaybackHistory(
                        contentId = currentContentId,
                        contentType = currentContentType,
                        providerId = currentProviderId,
                        seriesId = currentSeriesId,
                        seasonNumber = currentSeasonNumber,
                        episodeNumber = currentEpisodeNumber
                    )
                    if (isActivePlaybackSession(requestVersion, playbackLogicalUrl)) {
                        if (history != null && history.resumePositionMs > 5000L && !isPlaybackComplete(history.resumePositionMs, history.totalDurationMs)) {
                            playerEngine.pause()
                            _resumePrompt.value = ResumePromptState(
                                show = true,
                                positionMs = history.resumePositionMs,
                                title = currentTitle
                            )
                        }
                    }
                }
'''

          new = '''                // Automatically resume VOD playback from the saved position.
                // The player is already prepared here, so seeking now targets the active engine.
                if (showResumePrompt && currentContentType != ContentType.LIVE && currentContentId != -1L && currentProviderId != -1L) {
                    val history = playbackHistoryCoordinator.getPlaybackHistory(
                        contentId = currentContentId,
                        contentType = currentContentType,
                        providerId = currentProviderId,
                        seriesId = currentSeriesId,
                        seasonNumber = currentSeasonNumber,
                        episodeNumber = currentEpisodeNumber
                    )
                    if (isActivePlaybackSession(requestVersion, playbackLogicalUrl)) {
                        _resumePrompt.value = ResumePromptState()
                        if (history != null && history.resumePositionMs > 5000L && !isPlaybackComplete(history.resumePositionMs, history.totalDurationMs)) {
                            playerEngine.seekTo(history.resumePositionMs)
                        }
                        playerEngine.play()
                    }
                }
'''

          if old not in text:
              raise SystemExit("Expected resume-prompt block was not found; refusing to modify the file.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/streamvault/app/ui/screens/player/PlayerViewModel.kt .github/workflows/apply-auto-resume.yml
          git commit -m "feat: automatically resume VOD playback"
          git rm .github/workflows/apply-auto-resume.yml
          git commit -m "chore: remove one-shot resume workflow"
          git push origin HEAD:master
