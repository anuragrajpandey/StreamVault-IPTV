name: Unified Feature Cleanup

on:
  push:
    branches: [master]

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: run unified feature cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove obsolete feature files
        shell: bash
        run: |
          set -euo pipefail

          # Remove the dedicated Downloads UI/implementation files only.
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -f -- "$f"
          done < <(git ls-files | grep -Ei '(^|/)(Downloads?[^/]*|[^/]*Downloads?[^/]*)\\.(kt|kts|java|xml)$' || true)

          # Remove dedicated cast implementation files. Inline player plumbing is handled below.
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -f -- "$f"
          done < <(git ls-files | grep -Ei '(^|/)[^/]*Cast[^/]*\\.(kt|kts|java)$' | grep -E '(app/src/main|domain/src/main|data/src/main|player/src/main)' || true)

          # Remove dedicated recording implementation files, while leaving generic media/player files intact.
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -f -- "$f"
          done < <(git ls-files | grep -Ei '(^|/)[^/]*Recording[^/]*\\.(kt|kts|java)$' | grep -E '(app/src/main|domain/src/main|data/src/main|player/src/main)' || true)

      - name: Remove stale Android resources and manifest entries
        shell: bash
        run: |
          set -euo pipefail
          # Remove only clearly feature-specific resource names.
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -f -- "$f"
          done < <(git ls-files 'app/src/main/res/**' | grep -Ei '(^|/)(download|downloads|cast|recording)[^/]*\\.(xml|png|webp|jpg|jpeg)$' || true)

          # Remove manifest/service/provider lines only when they name a deleted feature class.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          if p.exists():
              text = p.read_text()
              lines = text.splitlines(True)
              out=[]
              for line in lines:
                  if any(x in line.lower() for x in ('downloadforegroundservice','recordingservice','castservice')):
                      continue
                  out.append(line)
              p.write_text(''.join(out))
          PY

      - name: Audit remaining feature references
        shell: bash
        run: |
          set +e
          echo '=== Downloads references ==='
          git grep -n -E 'DownloadsScreen|DownloadForegroundService|DownloadsViewModel|AppTopLevelDestination\\.DOWNLOADS|AppLandingDestination\\.DOWNLOADS|Routes\\.DOWNLOADS' -- app domain data player || true
          echo '=== Cast references ==='
          git grep -n -E 'CastConnectionState|PlayerCastCoordinator|CastPlaybackReportMode|onCast|onStopCasting' -- app domain data player || true
          echo '=== Recording references ==='
          git grep -n -E 'RecordingItem|RecordingRecurrence|RecordingStatus|PlayerRecordingCoordinator|currentChannelRecording|recordingItems' -- app domain data player || true
          echo '=== PiP references ==='
          git grep -n -E 'PictureInPicture|pictureInPicture|enterPlayerPictureInPicture|updatePlayerPictureInPicture|clearPlayerPictureInPicture' -- app domain data player || true

      - name: Compile and test
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_mega_feature_cleanup.yml
          git add -A
          git commit -m 'feat: remove obsolete downloads cast and recording implementations'
          git push origin master
