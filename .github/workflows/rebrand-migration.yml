name: EliteStocks TV Build & Verify

on:
  push:
    paths:
      - .github/workflows/rebrand-migration.yml
      - app/**
      - player/**
      - data/**
      - domain/**
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final player fixes and EliteStocks TV polish
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          # 1) Preserve the most recent engine position when ExoPlayer has already
          # reset its own currentPosition while dispatching a playback error.
          engine = root / 'player/src/main/java/com/streamvault/player/Media3PlayerEngine.kt'
          replace_once(
              engine,
              'currentPositionMs = player?.currentPosition,',
              'currentPositionMs = maxOf(player?.currentPosition ?: 0L, _currentPosition.value).takeIf { it > 0L },',
              'retry position fallback'
          )

          # 2) Use the new compact VOD controls while keeping the existing public
          # PlayerControlsOverlay API compatible through default parameters.
          chrome = root / 'app/src/main/java/com/streamvault/app/ui/screens/player/overlay/PlayerControlsChrome.kt'
          text = chrome.read_text(encoding='utf-8')

          replacements = [
              (
                  '    showEpisodesAction: Boolean = false,\n    onOpenEpisodes: () -> Unit = {},\n    onOpenSplitScreen:',
                  '    showEpisodesAction: Boolean = false,\n    onOpenEpisodes: () -> Unit = {},\n    showNextEpisodeAction: Boolean = false,\n    onPlayNextEpisode: () -> Unit = {},\n    onOpenSplitScreen:',
                  'overlay next-episode parameters'
              ),
              (
                  '                showEpisodesAction = showEpisodesAction,\n                onOpenEpisodes = onOpenEpisodes,\n                onOpenSplitScreen',
                  '                showEpisodesAction = showEpisodesAction,\n                onOpenEpisodes = onOpenEpisodes,\n                showNextEpisodeAction = showNextEpisodeAction,\n                onPlayNextEpisode = onPlayNextEpisode,\n                onOpenSplitScreen',
                  'overlay-to-bottom next-episode forwarding'
              ),
              (
                  '    showEpisodesAction: Boolean,\n    onOpenEpisodes: () -> Unit,\n    onOpenSplitScreen:',
                  '    showEpisodesAction: Boolean,\n    onOpenEpisodes: () -> Unit,\n    showNextEpisodeAction: Boolean,\n    onPlayNextEpisode: () -> Unit,\n    onOpenSplitScreen:',
                  'bottom-bar next-episode parameters'
              ),
              (
                  '                    PlayerVodInfo(\n',
                  '                    PlayerModernVodInfo(\n',
                  'switch VOD controls'
              ),
              (
                  '                        showEpisodesAction = showEpisodesAction,\n                        onOpenEpisodes = onOpenEpisodes,\n                        onEnterPictureInPicture',
                  '                        showEpisodesAction = showEpisodesAction,\n                        onOpenEpisodes = onOpenEpisodes,\n                        showNextEpisodeAction = showNextEpisodeAction,\n                        onPlayNextEpisode = onPlayNextEpisode,\n                        onEnterPictureInPicture',
                  'VOD next-episode forwarding'
              ),
              (
                  '    label: String,\n    contentDescription: String,',
                  '    icon: Int,\n    contentDescription: String,',
                  'transport icon parameter'
              ),
              (
                  '            Text(\n                text = label,\n                style = MaterialTheme.typography.headlineSmall,\n                color = Color.White\n            )',
                  '            Icon(\n                painter = painterResource(icon),\n                contentDescription = null,\n                tint = Color.White,\n                modifier = Modifier.size(28.dp)\n            )',
                  'transport icon rendering'
              ),
              (
                  'label = "\\u23EA",',
                  'icon = R.drawable.ic_replay_10,',
                  'rewind vector icon'
              ),
              (
                  'label = "\\u23E9",',
                  'icon = R.drawable.ic_forward_10,',
                  'forward vector icon'
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count == 0:
                  if label in {'VOD next-episode forwarding', 'overlay-to-bottom next-episode forwarding'}:
                      continue
                  raise SystemExit(f'{label}: pattern not found in {chrome}')
              if count != 1 and label not in {'rewind vector icon', 'forward vector icon'}:
                  raise SystemExit(f'{label}: expected 1 match in {chrome}, found {count}')
              text = text.replace(old, new)

          if 'import androidx.compose.ui.res.painterResource' not in text:
              text = text.replace(
                  'import androidx.compose.ui.res.stringResource\n',
                  'import androidx.compose.ui.res.painterResource\nimport androidx.compose.ui.res.stringResource\n',
                  1
              )
          chrome.write_text(text, encoding='utf-8')

          # 3) Wire the real ViewModel nextEpisode state to the new Next Episode
          # action. It is only exposed for episodic playback when a valid next
          # episode has actually been resolved.
          screen = root / 'app/src/main/java/com/streamvault/app/ui/screens/player/PlayerScreen.kt'
          text = screen.read_text(encoding='utf-8')
          text = text.replace(
              '    val currentEpisode by viewModel.currentEpisode.collectAsStateWithLifecycle()\n',
              '    val currentEpisode by viewModel.currentEpisode.collectAsStateWithLifecycle()\n    val nextEpisode by viewModel.nextEpisode.collectAsStateWithLifecycle()\n',
              1
          )
          text = text.replace(
              '    val canOpenEpisodePicker = contentType == "SERIES_EPISODE" &&\n        currentSeriesSeasons?.any { it.episodes.isNotEmpty() } == true\n',
              '    val canOpenEpisodePicker = contentType == "SERIES_EPISODE" &&\n        currentSeriesSeasons?.any { it.episodes.isNotEmpty() } == true\n    val showNextEpisodeAction = contentType == "SERIES_EPISODE" && nextEpisode != null\n',
              1
          )
          old = '            showEpisodesAction = canOpenEpisodePicker,\n            onOpenEpisodes = { showEpisodePicker = true },\n            onOpenSplitScreen = { showSplitDialog = true },'
          new = '            showEpisodesAction = canOpenEpisodePicker,\n            onOpenEpisodes = { showEpisodePicker = true },\n            showNextEpisodeAction = showNextEpisodeAction,\n            onPlayNextEpisode = viewModel::playNextEpisodeNow,\n            onOpenSplitScreen = { showSplitDialog = true },'
          if text.count(old) != 1:
              raise SystemExit(f'PlayerScreen overlay wiring: expected 1 match, found {text.count(old)}')
          screen.write_text(text.replace(old, new), encoding='utf-8')

          # 4) Tighten the warm EliteStocks palette. The previous migration already
          # moved the main palette to amber, but these two values were still blue.
          colors = root / 'app/src/main/java/com/streamvault/app/ui/design/AppColors.kt'
          if colors.exists():
              text = colors.read_text(encoding='utf-8')
              text = text.replace('0x335FA4FF', '0x33FFA000')
              text = text.replace('0x264C6D95', '0x33FFB52E')
              colors.write_text(text, encoding='utf-8')

          # 5) Ensure the 10-second vector resources remain present.
          drawable = root / 'app/src/main/res/drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          if not (drawable / 'ic_replay_10.xml').exists() or not (drawable / 'ic_forward_10.xml').exists():
              raise SystemExit('10-second player vector resources are missing')

      - name: Audit branding, English resources, and Android identifiers
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          text_exts = {'.kt', '.kts', '.java', '.xml', '.gradle', '.properties', '.md', '.txt', '.json', '.toml', '.pro', '.cfg', '.ini', '.sh'}
          technical = re.compile(r'''(?x)
              https?://[^\s"'<>]+ |
              com\.streamvault(?:\.[A-Za-z0-9_$]+)+ |
              streamvault://[^\s"'<>]+ |
              @(?:style|id|string|drawable|mipmap|layout|color|xml|raw|font|menu|navigation)/[A-Za-z0-9_.-]*streamvault[A-Za-z0-9_.-]* |
              R\.[A-Za-z0-9_]+\.[A-Za-z0-9_]*streamvault[A-Za-z0-9_]* |
              [A-Za-z0-9_$.-]+\.(?:StreamVault|streamvault)(?:\.[A-Za-z0-9_$.-]+)* |
              (?<![A-Za-z0-9_$])(?:StreamVault|streamvault)[A-Za-z0-9_$]+ |
              [A-Za-z0-9_$]+(?:StreamVault|streamvault)(?![A-Za-z0-9_$])
          ''')
          visible = re.compile(r'(?i)\bstreamvault\b')
          hits = []
          broken = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              if path.name == 'LICENSE' or path.name.endswith('lint-baseline.xml'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              check = technical.sub('', text)
              for line_no, line in enumerate(check.splitlines(), 1):
                  if visible.search(line):
                      hits.append(f'{path}:{line_no}:{line.strip()}')
              if path.suffix.lower() == '.xml':
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if re.search(r'(?i)(?:name|parent|style|id|resource|theme)\s*=\s*"[^"]*EliteStocks TV', line):
                          broken.append(f'{path}:{line_no}:{line.strip()}')
              if path.suffix.lower() in {'.kt', '.kts', '.java'}:
                  if re.search(r'\b(?:Theme|R\.[A-Za-z0-9_]+|[A-Za-z0-9_]+\.[A-Za-z0-9_]+)\.EliteStocks TV\b', text):
                      broken.append(str(path))

          language_dir = re.compile(r'^(?:[a-z]{2,3}(?:-r[A-Z]{2})?|b\+[A-Za-z0-9+]+)$')
          language_dirs = [p for p in root.rglob('values-*') if p.is_dir() and language_dir.fullmatch(p.name[7:])]
          if language_dirs:
              broken.extend(str(p) for p in language_dirs)

          if hits:
              print('Unexpected user-facing StreamVault references:')
              print('\n'.join(hits[:200]))
              raise SystemExit(1)
          if broken:
              print('Broken identifiers or language-specific resources:')
              print('\n'.join(broken[:200]))
              raise SystemExit(1)
          print('EliteStocks TV audit passed.')

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocks-TV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "fix: complete EliteStocks TV player polish"
          git push origin HEAD:master
