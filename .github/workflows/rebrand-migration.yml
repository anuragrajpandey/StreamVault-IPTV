name: EliteStocks TV Migration

on:
  push:
    paths:
      - .github/workflows/rebrand-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply EliteStocks TV branding and player resources
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          text_exts = {'.kt', '.kts', '.java', '.xml', '.gradle', '.properties', '.md', '.txt', '.json', '.toml', '.pro', '.cfg', '.ini', '.sh'}
          skip_names = {'LICENSE', 'rebrand-migration.yml'}

          # Technical identifiers are intentionally preserved. The application package,
          # database schema, compatibility keys and upstream URLs must not be renamed.
          technical = re.compile(
              r'''(?ix)
              https?://[^\s"'<>]+ |
              com\.streamvault(?:\.[A-Za-z0-9_$]+)+ |
              streamvault://[^\s"'<>]+ |
              (?<![A-Za-z0-9_$])(?:StreamVault|streamvault)[A-Za-z0-9_$]*(?=[A-Za-z0-9_$]) |
              (?<![A-Za-z0-9_$])[A-Za-z0-9_$]*(?:StreamVault|streamvault)[A-Za-z0-9_$]*(?![A-Za-z0-9_$])
              '''
          )

          def protect(text):
              saved = []
              def repl(m):
                  token = f'__SVTECH_{len(saved)}__'
                  saved.append(m.group(0))
                  return token
              return technical.sub(repl, text), saved

          def restore(text, saved):
              for i, value in enumerate(saved):
                  text = text.replace(f'__SVTECH_{i}__', value)
              return text

          def brand_visible(text):
              text = re.sub(r'(?i)streamvault\s+live\s+channels', 'EliteStocks TV Live Channels', text)
              text = re.sub(r'(?i)streamvault\s+tv', 'EliteStocks TV', text)
              return re.sub(r'(?i)\bstreamvault\b', 'EliteStocks TV', text)

          string_re = re.compile(r'("(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\')')

          def migrate_code(text):
              # Protect identifiers/URLs first, then brand strings and comments without
              # touching package names, class names, resource IDs or compatibility keys.
              protected, saved = protect(text)
              migrated = brand_visible(protected)
              return restore(migrated, saved)

          def migrate_xml(text):
              protected, saved = protect(text)
              migrated = brand_visible(protected)
              # Restore technical resource references that protection intentionally left alone.
              return restore(migrated, saved)

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              if path.name in skip_names or path.name.endswith('lint-baseline.xml'):
                  continue
              try:
                  old = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              if 'streamvault' not in old.lower():
                  continue
              if path.suffix.lower() in {'.kt', '.kts', '.java', '.xml'}:
                  new = migrate_code(old)
              else:
                  new = migrate_code(old)
              if new != old:
                  path.write_text(new, encoding='utf-8')

          # Remove only language-qualified resource directories. Keep night/land/port/v31/etc.
          language_dir = re.compile(r'^(?:[a-z]{2,3}(?:-r[A-Z]{2})?|b\+[A-Za-z0-9+]+)$')
          for path in sorted(root.rglob('values-*'), key=lambda p: len(p.parts), reverse=True):
              if path.is_dir() and language_dir.fullmatch(path.name[7:]):
                  shutil.rmtree(path)

          drawable = root / 'app/src/main/res/drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'ic_replay_10.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32">
              <path android:fillColor="#FFFFFFFF" android:pathData="M15,5A11,11 0,1 0,25.5 19h-3.2A8,8 0,1 1,15 8c2.4,0 4.6 1.1 6 3l-3,3h9V5l-3.5,3.5A10.9,10.9 0,0 0,15 5z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,13h2v6h5v2h-7z"/>
          </vector>
          ''', encoding='utf-8')
          (drawable / 'ic_forward_10.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32">
              <path android:fillColor="#FFFFFFFF" android:pathData="M17,5A11,11 0,1 1,6.5 19h3.2A8,8 0,1 0,17 8c-2.4,0-4.6 1.1-6 3l3,3H5V5l3.5,3.5A10.9,10.9 0,0 1,17 5z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M20,13h-2v6h-5v2h7z"/>
          </vector>
          ''', encoding='utf-8')

          palette = {
              '0xFF07111B':'0xFF070608', '0xFF0B1622':'0xFF0D0A08', '0xFF0F1B29':'0xFF15100B',
              '0xFF162338':'0xFF20160B', '0xFF1D2E46':'0xFF2A1B0A', '0xFF223754':'0xFF3A250A',
              '0xFF69A8FF':'0xFFFFA000', '0xFF8BBCFF':'0xFFFFB52E', '0xFF57C9FF':'0xFFFFB52E',
              '0xFFFFC766':'0xFFFFB52E', '0xCC07111B':'0xCC070608', '0xF207111B':'0xF2070608'
          }
          for path in [root / 'app/src/main/java/com/streamvault/app/ui/design/AppColors.kt', root / 'app/src/main/java/com/streamvault/app/ui/theme/Color.kt']:
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  for old, new in palette.items():
                      text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')

      - name: Verify no user-facing StreamVault branding
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          text_exts = {'.kt', '.kts', '.java', '.xml', '.gradle', '.properties', '.md', '.txt', '.json', '.toml', '.pro', '.cfg', '.ini', '.sh'}
          # Ignore legal attribution and internal technical identifiers. The audit targets
          # standalone user-visible product text, not package/class/database compatibility names.
          visible = re.compile(r'(?i)\bstreamvault\b')
          hits = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              if path.name == 'LICENSE' or path.name == 'rebrand-migration.yml' or path.name.endswith('lint-baseline.xml'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if not visible.search(line):
                      continue
                  low = line.lower()
                  # URLs, package/import declarations and CamelCase/identifier references are internal.
                  if ('http://' in low or 'https://' in low or 'streamvault://' in low or
                      'package com.streamvault' in low or 'import com.streamvault' in low or
                      re.search(r'[A-Za-z0-9_$](?:StreamVault|streamvault)(?:[A-Za-z0-9_$])', line)):
                      continue
                  hits.append(f'{path}:{line_no}:{line.strip()}')
          if hits:
              print('\n'.join(hits[:200]))
              raise SystemExit(1)
          print('EliteStocks TV branding audit passed.')

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocks-TV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes detected."
            exit 0
          fi
          git commit -m "feat: rebrand Android TV app to EliteStocks TV"
          git push origin HEAD:master
