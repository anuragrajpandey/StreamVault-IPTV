name: EliteStocks TV Migration

on:
  push:
    paths:
      - .github/workflows/rebrand-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply branding and resource migration
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          text_exts = {'.kt', '.kts', '.java', '.xml', '.gradle', '.properties', '.md', '.txt', '.yml', '.yaml', '.json', '.toml', '.pro', '.cfg', '.ini', '.sh'}

          def brand(text):
              text = re.sub(r'(?i)streamvault\s+live\s+channels', 'EliteStocks TV Live Channels', text)
              text = re.sub(r'(?i)streamvault\s+tv', 'EliteStocks TV', text)
              return re.sub(r'(?i)streamvault', 'EliteStocks TV', text)

          string_re = re.compile(r'("(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\')')

          def code_replace(text):
              def repl(match):
                  value = match.group(0)
                  inner = value[1:-1]
                  low = inner.lower()
                  if ('com.streamvault' in low or 'streamvault.' in low or
                      'streamvault://' in low or 'http://' in low or 'https://' in low):
                      return value
                  return value[0] + brand(inner) + value[-1]
              return string_re.sub(repl, text)

          def xml_replace(text):
              attr = re.compile(r'([A-Za-z_][\w:.-]*)\s*=\s*([\"\'])(.*?)\2', re.S)
              protected = {'android:name', 'android:theme', 'android:resource', 'android:icon',
                           'android:roundIcon', 'android:banner', 'android:authorities', 'android:src'}
              def repl(match):
                  name, quote, value = match.group(1), match.group(2), match.group(3)
                  low = value.lower()
                  if name in protected or value.startswith('@') or value.startswith('.') or 'com.streamvault' in low or 'http://' in low or 'https://' in low:
                      return match.group(0)
                  return f'{name}={quote}{brand(value)}{quote}'
              return attr.sub(repl, text)

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              if path.name == 'LICENSE' or path.name.endswith('lint-baseline.xml'):
                  continue
              try:
                  old = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              if 'streamvault' not in old.lower():
                  continue
              if path.suffix.lower() == '.xml':
                  new = xml_replace(old)
              elif path.suffix.lower() in {'.kt', '.kts', '.java'}:
                  new = code_replace(old)
              else:
                  lines = []
                  for line in old.splitlines(keepends=True):
                      low = line.lower()
                      if ('com.streamvault' in low or 'streamvault://' in low or
                          ('https://' in low and 'streamvault' in low)):
                          if path.name == 'README.md':
                              prefix, sep, suffix = line.partition('http')
                              if sep:
                                  visible = prefix.replace('StreamVault', 'EliteStocks TV').replace('streamvault', 'EliteStocks TV')
                                  lines.append(visible + sep + suffix)
                                  continue
                          lines.append(line)
                      else:
                          lines.append(brand(line))
                  new = ''.join(lines)
              if new != old:
                  path.write_text(new, encoding='utf-8')

          language_dir = re.compile(r'^(?:[a-z]{2,3}(?:-r[A-Z]{2})?|b\+[A-Za-z0-9+]+)$')
          for path in sorted(root.rglob('values-*'), key=lambda p: len(p.parts), reverse=True):
              if path.is_dir() and language_dir.fullmatch(path.name[7:]):
                  shutil.rmtree(path)

          drawable = root / 'app/src/main/res/drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'ic_replay_10.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32">
              <path android:fillColor="#FFFFFFFF" android:pathData="M15,5A11,11 0,1 0,25.5 19h-3.2A8,8 0,1 1,15 8c2.4,0 4.6 1.1 6 3l-3,3h9V5l-3.5,3.5A10.9,10.9 0,0 0,15 5z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,13h2v6h5v2h-7z"/>
          </vector>
          ''', encoding='utf-8')
          (drawable / 'ic_forward_10.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="32dp" android:height="32dp" android:viewportWidth="32" android:viewportHeight="32">
              <path android:fillColor="#FFFFFFFF" android:pathData="M17,5A11,11 0,1 1,6.5 19h3.2A8,8 0,1 0,17 8c-2.4,0-4.6 1.1-6 3l3,3H5V5l3.5,3.5A10.9,10.9 0,0 1,17 5z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M20,13h-2v6h-5v2h7z"/>
          </vector>
          ''', encoding='utf-8')

          palette = {
              '0xFF07111B':'0xFF070608', '0xFF0B1622':'0xFF0D0A08', '0xFF0F1B29':'0xFF15100B',
              '0xFF162338':'0xFF20160B', '0xFF1D2E46':'0xFF2A1B0A', '0xFF223754':'0xFF3A250A',
              '0xFF69A8FF':'0xFFFFA000', '0xFF8BBCFF':'0xFFFFB52E', '0xFF57C9FF':'0xFFFFB52E',
              '0xFFFFC766':'0xFFFFB52E', '0xCC07111B':'0xCC070608', '0xF207111B':'0xF2070608'
          }
          for path in [root / 'app/src/main/java/com/streamvault/app/ui/design/AppColors.kt',
                       root / 'app/src/main/java/com/streamvault/app/ui/theme/Color.kt']:
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  for old, new in palette.items():
                      text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')

          # Audit actual user-facing occurrences. CamelCase technical identifiers such as
          # StreamVaultDatabase and legacy compatibility filenames are intentionally retained.
          hits = []
          visible_brand = re.compile(r'(?i)\bstreamvault\b')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              if path.name == 'LICENSE' or path.name.endswith('lint-baseline.xml'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  low = line.lower()
                  if not visible_brand.search(line):
                      continue
                  if ('package com.streamvault' in low or 'import com.streamvault' in low or
                      'com.streamvault.' in low or 'streamvault://' in low or
                      ('https://' in low and 'streamvault' in low)):
                      continue
                  hits.append(f'{path}:{number}:{line.strip()}')

          if hits:
              print('Remaining non-technical branding references:')
              print('\n'.join(hits[:100]))
              raise SystemExit(1)
          print('Branding/resource migration passed.')

      - name: Verify Kotlin tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest :app:assembleDebug

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes detected."
            exit 0
          fi
          git commit -m "feat: rebrand Android TV app to EliteStocks TV"
          git push origin HEAD:master
