name: Feature Cleanup Run

on:
  push:
    branches: [master]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove dedicated feature implementations
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -Ei '(^|/)(Downloads?[^/]*|[^/]*Downloads?[^/]*)\.(kt|kts|java)$' | xargs -r git rm -f --
          git ls-files | grep -Ei '(^|/)[^/]*Cast[^/]*\.(kt|kts|java)$' | grep -E '^app/src/main/' | xargs -r git rm -f --
          git ls-files | grep -Ei '(^|/)[^/]*Recording[^/]*\.(kt|kts|java)$' | grep -E '^app/src/main/' | xargs -r git rm -f --
          git ls-files 'app/src/main/res/**' | grep -Ei '(^|/)(download|downloads|cast|recording)[^/]*\.(xml|png|webp|jpg|jpeg)$' | xargs -r git rm -f --

      - name: Audit remaining references
        shell: bash
        run: |
          set +e
          echo '=== feature references after dedicated-file removal ==='
          git grep -n -E 'DownloadsScreen|DownloadsViewModel|DownloadForegroundService|AppTopLevelDestination\.DOWNLOADS|AppLandingDestination\.DOWNLOADS|Routes\.DOWNLOADS|CastConnectionState|PlayerCastCoordinator|CastPlaybackReportMode|CastRouteChooserActivity|CastManager|onCast|onStopCasting|RecordingItem|RecordingRecurrence|RecordingStatus|PlayerRecordingCoordinator|currentChannelRecording|recordingItems|PictureInPicture|pictureInPicture|enterPlayerPictureInPicture|updatePlayerPictureInPicture|clearPlayerPictureInPicture' -- app domain data player 2>&1 || true

      - name: Compile unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Commit successful cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-run.yml .github/workflows/_mega_feature_cleanup.yml _cleanup_trigger.txt
          git add -A
          git commit -m 'feat: remove obsolete media features'
          git push origin master
