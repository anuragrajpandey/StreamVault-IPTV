name: EliteStocks TV final cleanup v2

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]

permissions:
  contents: write

jobs:
  final-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean TV source
        shell: bash
        run: |
          set -euo pipefail
          BASE=55cd29e5cd20ac57ab98d4b625e7da63d5ca5ec1
          git restore --source="$BASE" -- app data domain player gradle/libs.versions.toml
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots=[Path('app/src/main'),Path('app/src/test'),Path('app/src/androidTest'),Path('data/src/main'),Path('data/src/test'),Path('domain/src/main'),Path('domain/src/test'),Path('player/src/main')]
          feature=re.compile(r'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|CastManager|CastModels|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|RecordingAlarmScheduler|RecordingManager|RecordingItem|RecordingRecurrence|RecordingStatus|DownloadDao|DownloadEntity|DownloadStatus|DownloadItem|DownloadRequest|DownloadManagerImpl|PendingBackupRestoreCoordinator|BackupManagerImpl|BackupManager|BackupFileBridge|BackupRestore|GoogleDriveBackupSyncManager|DriveBackupSyncManager')

          def delta(s): return s.count('{')-s.count('}')
          def block(text,start):
              p=text.find(start)
              if p<0: return None
              line_start=text.rfind('\n',0,p)+1
              lines=text[line_start:].splitlines(True); out=[]; depth=0; started=False
              for line in lines:
                  out.append(line); depth+=delta(line)
                  if '{' in line: started=True
                  if started and depth==0: break
              return ''.join(out)
          def remove_block(text,marker):
              while marker in text:
                  b=block(text,marker)
                  if not b: break
                  text=text.replace(b,'',1)
              return text
          def extract(text,marker):
              b=block(text,marker)
              if not b: raise SystemExit(f'missing preserved marker: {marker}')
              return b
          def imports_prefix(text,decl):
              p=text.find(decl)
              if p<0: raise SystemExit(f'missing declaration marker: {decl}')
              head=text[:p]
              # Keep package/import section only.
              m=list(re.finditer(r'^\\s*(?:import|package) .*$',head,re.M))
              if not m: raise SystemExit('no package/import header')
              end=m[-1].end()
              return head[:end]+'\n\n'

          # Keep shared Program Reminder infrastructure while removing DVR DAOs/entities.
          dao=Path('data/src/main/java/com/streamvault/data/local/dao/RecordingDaos.kt')
          if dao.exists():
              s=dao.read_text(); dao.write_text(imports_prefix(s,'@Dao\ninterface ProgramReminderDao')+extract(s,'@Dao\ninterface ProgramReminderDao'))
          ent=Path('data/src/main/java/com/streamvault/data/local/entity/RecordingEntities.kt')
          if ent.exists():
              s=ent.read_text(); ent.write_text(imports_prefix(s,'@Entity(\n    tableName = "program_reminders"')+extract(s,'@Entity(\n    tableName = "program_reminders"'))

          delete_names={
            'PlayerCastCoordinator.kt','CastMediaRequestFactory.kt','CastManager.kt','CastModels.kt','CastPlaybackCoordinator.kt','CastRouteChooserActivity.kt','CastUiMessages.kt','StreamVaultCastOptionsProvider.kt','CastModule.kt',
            'DownloadForegroundService.kt','DownloadManagerImpl.kt','DownloadManager.kt','DownloadsScreen.kt','DownloadsUiState.kt','DownloadsViewModel.kt','DownloadDao.kt','DownloadEntity.kt','DownloadStatus.kt','DownloadItem.kt','DownloadRequest.kt',
            'PlayerRecordingCoordinator.kt','RecordingManager.kt','RecordingManagerImpl.kt','RecordingModels.kt','RecordingConflictDetector.kt','RecordingAlarmScheduler.kt','RecordingAlarmReceiver.kt','RecordingCaptureEngine.kt','RecordingForegroundIdleGate.kt','RecordingForegroundService.kt','RecordingReconcileWorker.kt','RecordingRestoreReceiver.kt','RecordingServiceLauncher.kt','RecordingSourceResolver.kt','RecordingSupport.kt','ScheduleRecording.kt','RecordingRecurrence.kt','RecordingStatus.kt','RecordingItem.kt',
            'BackupFileBridge.kt','BackupManager.kt','BackupManagerImpl.kt','BackupRestoreStatusStoreImpl.kt','PendingBackupRestoreCoordinator.kt','ExportBackup.kt','ImportBackup.kt','BackupRestoreCheckpointDao.kt','BackupRestoreLedgerDao.kt','BackupRestoreLedgerEntities.kt','DriveBackupSyncManager.kt','GoogleDriveBackupSyncManager.kt','PlayerResumePrompt.kt'
          }
          for root in roots:
              if root.exists():
                  for f in root.rglob('*.kt'):
                      if f.name in delete_names: f.unlink()
          for d in [Path('app/src/main/java/com/streamvault/app/cast'),Path('app/src/main/java/com/streamvault/app/backup'),Path('app/src/main/java/com/streamvault/app/ui/screens/downloads')]:
              if d.exists():
                  for f in sorted(d.rglob('*'),reverse=True):
                      if f.is_file(): f.unlink()
                      elif f.is_dir(): f.rmdir()
                  d.rmdir()

          # Database registrations.
          db=Path('data/src/main/java/com/streamvault/data/local/StreamVaultDatabase.kt')
          s=db.read_text()
          for n in ['RecordingScheduleEntity','RecordingRunEntity','RecordingStorageEntity','DownloadEntity','BackupRestoreCheckpointEntity','BackupRestoreJobEntity','BackupRestoreItemEntity']:
              s=re.sub(r'^\\s*'+n+r'\\s*,?\\s*$', '', s, flags=re.M)
          for n in ['recordingScheduleDao','recordingRunDao','recordingStorageDao','downloadDao','backupRestoreCheckpointDao','backupRestoreLedgerDao']:
              s=re.sub(r'^\\s*abstract fun '+n+r'\\([^\\n]*\\):[^\\n]*$', '', s, flags=re.M)
          db.write_text(s)

          # Remove feature imports, properties, constructor parameters, DI methods and feature-named functions.
          for root in roots:
              if not root.exists(): continue
              for f in root.rglob('*.kt'):
                  s=f.read_text(errors='ignore')
                  s=re.sub(r'^\\s*import .*?(?:cast|recording|backup|downloads?|Cast|Recording|Backup).*?$', '', s, flags=re.I|re.M)
                  s=re.sub(r'^\\s*(?:internal\\s+|private\\s+|public\\s+)?(?:val|var|lateinit var)\\s+\\w+\\s*:\\s*[^\\n]*(?:Recording|Backup|Cast|Download)[^\\n]*$', '', s, flags=re.M)
                  # Constructor/property parameter lines for deleted feature types.
                  s=re.sub(r'^\\s*(?:internal\\s+|private\\s+)?(?:val|var)?\\s*\\w+\\s*:\\s*[^\\n]*(?:Recording|Backup|Cast|Download)[^\\n]*,?\\s*$', '', s, flags=re.M)
                  # Remove feature-named methods/functions.
                  for m in list(re.finditer(r'(?m)^\\s*(?:private |internal |public |override )*(?:suspend )?fun\\s+\\w*(?:Backup|Restore|Recording|Cast|Download)\\w*\\s*\\(',s)):
                      s=remove_block(s,m.group(0))
                      break
                  # Remove common feature observer/callback calls and assignments.
                  s=re.sub(r'^\\s*.*(?:observeRecording|observeCast|registerRecording|refreshCurrentChannelRecording|handleRecordingStateChanges|playerRecordingCoordinator|playerCastCoordinator|pendingBackupRestoreCoordinator).*$', '', s, flags=re.I|re.M)
                  f.write_text(s)

          # Provider repository cleanup, preserving ordinary provider credentials infrastructure.
          for path in ['domain/src/main/java/com/streamvault/domain/repository/ProviderRepository.kt','data/src/main/java/com/streamvault/data/repository/ProviderRepositoryImpl.kt']:
              f=Path(path)
              if f.exists():
                  s=f.read_text()
                  for name in ['Backup','Restore','Recording','Cast','Download']:
                      while True:
                          m=re.search(r'(?m)^\\s*(?:suspend )?(?:fun|override fun)\\s+\\w*'+name+r'\\w*\\s*\\(',s)
                          if not m: break
                          s=remove_block(s,m.group(0))
                  s=re.sub(r'^\\s*private val (?:recordingRunDao|recordingAlarmScheduler|pendingBackupRestoreCoordinator)\\s*:[^\\n]+,?$', '', s, flags=re.M)
                  f.write_text(s)

          # Provider deletion cleanup keeps reminder + sync cleanup, drops DVR alarm path.
          f=Path('data/src/main/java/com/streamvault/data/repository/ProviderDeletionCleanupWorker.kt')
          if f.exists():
              s=f.read_text()
              s=re.sub(r'^\\s*fun recordingAlarmScheduler\\(\\):[^\\n]*$', '', s, flags=re.M)
              s=re.sub(r'^\\s*cancelRecordingAlarm\\s*=.*$', '', s, flags=re.M)
              s=re.sub(r'^\\s*const val RECORDING_ALARM.*$', '', s, flags=re.M)
              s=re.sub(r'^\\s*cancelRecordingAlarm\\s*:\\s*[^,\\n]+,?$', '', s, flags=re.M)
              s=remove_block(s,'is ProviderDeletionCleanupEntity.RECORDING_ALARM')
              f.write_text(s)

          # SyncManager loses the backup coordinator only.
          f=Path('data/src/main/java/com/streamvault/data/sync/SyncManager.kt')
          if f.exists(): f.write_text(re.sub(r'^\\s*private val pendingBackupRestoreCoordinator\\s*:[^\\n]+,?$', '', f.read_text(), flags=re.M))

          # MainActivity PiP + backup intent helpers.
          f=Path('app/src/main/java/com/streamvault/app/MainActivity.kt')
          if f.exists():
              s=f.read_text()
              for marker in ['updatePlayerPictureInPictureState','clearPlayerPictureInPictureState','enterPlayerPictureInPictureModeFromPlayer','enterPlayerPictureInPictureModeIfEligible','applyPlayerPictureInPictureParams','videoAspectRatioOrNull','supportsPictureInPicture','private fun Intent.readImportedBackupUri','private fun Intent.isBackupJsonCandidate']:
                  s=remove_block(s,marker)
              s=re.sub(r'^\\s*override fun onUserLeaveHint\\(\\).*?^\\s*}\\s*$', '', s, flags=re.M|re.S)
              s=re.sub(r'^\\s*override fun onPictureInPictureModeChanged\\(.*?^\\s*}\\s*$', '', s, flags=re.M|re.S)
              s=re.sub(r'^\\s*import android\\.util\\.Rational$', '', s, flags=re.M)
              s=re.sub(r'^\\s*import android\\.content\\.pm\\.PackageManager$', '', s, flags=re.M)
              f.write_text(s)

          # PlayerViewModel automatic VOD/series resume, no prompt.
          f=Path('app/src/main/java/com/streamvault/app/ui/screens/player/PlayerViewModel.kt')
          if f.exists():
              s=f.read_text()
              for marker in ['internal fun refreshCurrentChannelRecording','private fun handleRecordingStateChanges']:
                  s=remove_block(s,marker)
              s=re.sub(r'^\\s*internal val _resumePrompt.*$', '', s, flags=re.M)
              s=re.sub(r'^\\s*val resumePrompt.*$', '', s, flags=re.M)
              old=re.compile(r'(?ms)^\\s*// Check for resume position after the player is fully prepared \\(VOD only\\)\\..*?^\\s*}\\s*}\\s*}\\s*$')
              new='''                // Automatically restore the saved VOD/series position after preparation.\n                if (currentContentType != ContentType.LIVE && currentContentId != -1L && currentProviderId != -1L) {\n                    val history = playbackHistoryCoordinator.getPlaybackHistory(\n                        contentId = currentContentId, contentType = currentContentType, providerId = currentProviderId,\n                        seriesId = currentSeriesId, seasonNumber = currentSeasonNumber, episodeNumber = currentEpisodeNumber\n                    )\n                    if (isActivePlaybackSession(requestVersion, playbackLogicalUrl) && history != null &&\n                        history.resumePositionMs > 5000L && !isPlaybackComplete(history.resumePositionMs, history.totalDurationMs)) {\n                        playerEngine.seekTo(history.resumePositionMs)\n                    }\n                }\n            }\n        }\n'''
              s,n=old.subn(new,s,count=1)
              s=s.replace('        showResumePrompt: Boolean = true','')
              s=re.sub(r',\\s*showResumePrompt\\s*=\\s*true','',s)
              f.write_text(s)

          # PlayerScreen remove PiP/prompt/Cast/DVR UI blocks.
          f=Path('app/src/main/java/com/streamvault/app/ui/screens/player/PlayerScreen.kt')
          if f.exists():
              s=f.read_text()
              s=re.sub(r'^\\s*import .*PlayerResumePrompt.*$', '', s, flags=re.M)
              for marker in ['if (resumePrompt.show)','val enterPictureInPicture = remember(mainActivity)','DisposableEffect(mainActivity)','LaunchedEffect(isInPictureInPictureMode)','LifecycleEventEffect(Lifecycle.Event.ON_STOP)']:
                  s=remove_block(s,marker)
              s=re.sub(r'^\\s*val resumePrompt by .*$', '', s, flags=re.M)
              s=re.sub(r'^\\s*val castConnectionState by .*$', '', s, flags=re.M)
              s=re.sub(r'^\\s*(?:castConnectionState|currentChannelRecording)\\s*=.*$', '', s, flags=re.M)
              s=re.sub(r'^\\s*on(?:Cast|Record|StartRecording|StopRecording)[^\\n]*$', '', s, flags=re.M)
              s=s.replace('BackHandler(enabled = !resumePrompt.show)', 'BackHandler')
              s=s.replace('!isInPictureInPictureMode && autoPlayCountdown != null','autoPlayCountdown != null')
              f.write_text(s)

          # Settings and other UI: remove complete feature-named sections/observers while keeping ordinary UI.
          ui=Path('app/src/main/java/com/streamvault/app/ui')
          if ui.exists():
              for f in ui.rglob('*.kt'):
                  s=f.read_text(errors='ignore')
                  for marker in ['if (showLocalBackupManager)','if (showBackupRestore)','if (showRecording','if (recording','if (currentChannelRecording','if (resumePrompt.show)','RecordingControls(','CastControls(']:
                      s=remove_block(s,marker)
                  s=re.sub(r'^\\s*.*(?:BackupRestore|backupRestore|recordingManager|recordingItems|currentChannelRecording|onStartRecording|onStopRecording|onRecord|onCast|castConnectionState|downloadsScreen|DownloadItem|RecordingItem).*$', '', s, flags=re.I|re.M)
                  f.write_text(s)

          # DI/app startup files need no bindings/fields for deleted features.
          for path in ['app/src/main/java/com/streamvault/app/StreamVaultApp.kt','app/src/main/java/com/streamvault/app/di/DatabaseModule.kt','app/src/main/java/com/streamvault/app/di/RepositoryModule.kt']:
              f=Path(path)
              if f.exists():
                  s=f.read_text()
                  s=re.sub(r'^\\s*.*(?:Recording|Backup|Cast|Download).*$','',s,flags=re.I|re.M)
                  f.write_text(s)

          # Manifest/dependencies.
          f=Path('app/src/main/AndroidManifest.xml')
          if f.exists():
              s=f.read_text(); s=re.sub(r'\\s*<[^>]*(?:Download|Recording|Cast)[^>]*/>','',s,flags=re.I); s=re.sub(r'\\s*<[^>]*(?:Download|Recording|Cast)[^>]*>.*?</[^>]+>','',s,flags=re.I|re.S); f.write_text(s)
          f=Path('app/build.gradle.kts')
          if f.exists():
              s=f.read_text(); s=re.sub(r'^\\s*implementation\\(libs\\.play\\.services\\.cast\\.framework\\)\\s*$','',s,flags=re.M); s=re.sub(r'^\\s*implementation\\(libs\\.mediarouter\\)\\s*$','',s,flags=re.M); f.write_text(s)

          # Remove feature-only tests and overlays.
          for root in [Path('app/src/test'),Path('app/src/androidTest'),Path('data/src/test'),Path('domain/src/test')]:
              if root.exists():
                  for f in root.rglob('*.kt'):
                      if any(x in f.name.lower() for x in ['backup','recording','cast','downloads']): f.unlink()

          # Do not flag Android's ordinary system DownloadManager used by update/install code.
          forbidden=re.compile(r'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|RecordingAlarmScheduler|RecordingManager|RecordingItem|RecordingRecurrence|RecordingStatus|DownloadDao|DownloadEntity|DownloadStatus|DownloadItem|DownloadRequest|PendingBackupRestoreCoordinator|BackupManagerImpl|BackupFileBridge|BackupRestore|GoogleDriveBackupSyncManager|DriveBackupSyncManager')
          hits=[]
          for root in [Path('app/src/main'),Path('data/src/main'),Path('domain/src/main'),Path('player/src/main')]:
              if root.exists():
                  for f in root.rglob('*.kt'):
                      for n,line in enumerate(f.read_text(errors='ignore').splitlines(),1):
                          if forbidden.search(line): hits.append(f'{f}:{n}:{line.strip()}')
          if hits:
              print('\\n'.join(hits)); raise SystemExit('forbidden TV feature reference remains')
          PY
          git diff --check

      - name: Build and test once
        run: ./gradlew :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Final residual audit
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|RecordingAlarmScheduler|RecordingManager|DownloadDao|DownloadEntity|DownloadStatus|DownloadItem|DownloadRequest|PendingBackupRestoreCoordinator|BackupManagerImpl|BackupFileBridge|BackupRestore|GoogleDriveBackupSyncManager|DriveBackupSyncManager' -- 'app/src' 'data/src' 'domain/src' 'player/src'; then exit 1; fi
          test ! -d app/src/main/java/com/streamvault/app/cast
          test ! -d app/src/main/java/com/streamvault/app/backup
          test ! -d app/src/main/java/com/streamvault/app/ui/screens/downloads
          echo 'Final TV cleanup audit passed.'

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f scripts/final_tv_cleanup.py 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No source changes to commit.'; else git commit -m 'refactor: complete EliteStocks TV cleanup [skip ci]'; git push origin HEAD:elitestocks-tv-feature-cleanup; fi
