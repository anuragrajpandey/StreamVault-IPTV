name: One Shot Repair

on: push

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair source
        run: |
          python3 -c 'from pathlib import Path; p=Path("data/src/main/java/com/streamvault/data/sync/SyncManager.kt"); s=p.read_text(); m="): com.streamvault.domain.model.Result<Unit> = withProviderLock(providerId) lock@{"; print("wrapper matches",s.count(m)); s=s.replace(m,"): com.streamvault.domain.model.Result<Unit> {\n        if (trackInitialLiveOnboarding) {\n            return awaitInitialCatalog(",1); s=s.replace("return@lock awaitInitialCatalog(","return awaitInitialCatalog(",1); t="                afterCatalogApply = afterCatalogApply\n            )\n        }\n\n        var progressSession: SyncProgressSession? = null"; print("tail matches",s.count(t)); s=s.replace(t,"                afterCatalogApply = afterCatalogApply\n            )\n        }\n\n        return withProviderLock(providerId) lock@{\n        var progressSession: SyncProgressSession? = null",1); a=s.index("override suspend fun syncWithProviderOverride"); b=s.index("\n    fun resetState",a); q=s[a:b].rstrip(); s=s[:a]+q[:-5]+"    }\n    }"+s[b:]; p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt"); s=p.read_text(); s=s.replace("fun take(providerId: Long): suspend () -> Unit = callbacks.remove(providerId) ?: {}","fun take(providerId: Long): (suspend () -> Unit)? = callbacks.remove(providerId)"); p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt"); s=p.read_text(); m="if (trackInitialLiveOnboarding && staged.acceptedCount > 0 && !initialCatalogCommitted) {"; print("guards",s.count(m)); s=s.replace(m,"val initialCatalogCallback = if (trackInitialLiveOnboarding) InitialCatalogCallbackRegistry.take(provider.id) else null\n            if (initialCatalogCallback != null && staged.acceptedCount > 0 && !initialCatalogCommitted) {",2); m2="afterCatalogApply = InitialCatalogCallbackRegistry.take(provider.id)"; print("callbacks",s.count(m2)); s=s.replace(m2,"afterCatalogApply = initialCatalogCallback",2); p.write_text(s)'
      - name: Run focused tests
        run: ./gradlew --console=plain :data:testDebugUnitTest --tests 'com.streamvault.data.sync.SyncManagerTest' --tests 'com.streamvault.data.sync.SyncManagerXtreamLiveStrategyTest'
      - name: Commit and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/src/main/java/com/streamvault/data/sync/SyncManager.kt data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt
          git commit -m "fix: release provider lock before progressive onboarding"
          git rm .github/workflows/one-shot-repair.yml
          git commit -m "chore: remove one-shot repair workflow"
          git push
