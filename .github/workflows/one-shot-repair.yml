name: One Shot Repair

on:
  push:
    branches:
      - master

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair progressive onboarding source
        shell: bash
        run: |
          set -euo pipefail
          git checkout f58066d876fa08db0b27503376d8546eb79be600 -- data/src/main/java/com/streamvault/data/sync/SyncManager.kt

          python3 - <<'PY'
          from pathlib import Path

          p = Path("data/src/main/java/com/streamvault/data/sync/SyncManager.kt")
          s = p.read_text()

          opening = """    ): com.streamvault.domain.model.Result<Unit> = withProviderLock(providerId) lock@{
          if (trackInitialLiveOnboarding) {
              return@lock awaitInitialCatalog(
                  providerId = providerId,
                  force = force,
                  movieFastSyncOverride = movieFastSyncOverride,
                  epgSyncModeOverride = epgSyncModeOverride,
                  onProgress = onProgress,
                  trackInitialLiveOnboarding = trackInitialLiveOnboarding,
                  providerOverride = providerOverride,
                  afterCatalogApply = afterCatalogApply
              )
          }

          var progressSession: SyncProgressSession? = null"""

          replacement = """    ): com.streamvault.domain.model.Result<Unit> {
          if (trackInitialLiveOnboarding && afterCatalogApply != null) {
              return awaitInitialCatalog(
                  providerId = providerId,
                  force = force,
                  movieFastSyncOverride = movieFastSyncOverride,
                  epgSyncModeOverride = epgSyncModeOverride,
                  onProgress = onProgress,
                  trackInitialLiveOnboarding = trackInitialLiveOnboarding,
                  providerOverride = providerOverride,
                  afterCatalogApply = afterCatalogApply
              )
          }

          return withProviderLock(providerId) lock@{
          var progressSession: SyncProgressSession? = null"""

          if s.count(opening) != 1:
              raise SystemExit(f"opening pattern count={s.count(opening)}")
          s = s.replace(opening, replacement, 1)

          closing = """        }
    }

    fun resetState"""
          if s.count(closing) != 1:
              raise SystemExit(f"closing pattern count={s.count(closing)}")
          s = s.replace(closing, """        }
        }
    }

    fun resetState""", 1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt")
          s = p.read_text()
          old = "fun take(providerId: Long): suspend () -> Unit = callbacks.remove(providerId) ?: {}"
          new = "fun take(providerId: Long): (suspend () -> Unit)? = callbacks.remove(providerId)"
          if s.count(old) != 1:
              raise SystemExit(f"callback pattern count={s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt")
          s = p.read_text()
          guard = "if (trackInitialLiveOnboarding && staged.acceptedCount > 0 && !initialCatalogCommitted) {"
          callback = "afterCatalogApply = InitialCatalogCallbackRegistry.take(provider.id)"
          if s.count(guard) != 2 or s.count(callback) != 2:
              raise SystemExit(f"strategy patterns guard={s.count(guard)} callback={s.count(callback)}")
          s = s.replace(guard, "val initialCatalogCallback = if (trackInitialLiveOnboarding) InitialCatalogCallbackRegistry.take(provider.id) else null\n            if (initialCatalogCallback != null && staged.acceptedCount > 0 && !initialCatalogCommitted) {", 2)
          s = s.replace(callback, "afterCatalogApply = initialCatalogCallback", 2)
          p.write_text(s)
          PY

          echo "Verifying progressive onboarding lock boundary..."
          grep -n "trackInitialLiveOnboarding && afterCatalogApply != null" data/src/main/java/com/streamvault/data/sync/SyncManager.kt
          grep -n "val initialCatalogCallback" data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt
          grep -n "fun take(providerId: Long): (suspend () -> Unit)?" data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt

          ./gradlew --console=plain :data:testDebugUnitTest --tests 'com.streamvault.data.sync.SyncManagerTest' --tests 'com.streamvault.data.sync.SyncManagerXtreamLiveStrategyTest'
          ./gradlew --console=plain :app:assembleDebug

      - name: Commit source fix and remove repair workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/src/main/java/com/streamvault/data/sync/SyncManager.kt data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt
          git commit -m "fix: isolate progressive onboarding from provider lock"
          git rm .github/workflows/one-shot-repair.yml
          git commit -m "chore: remove one-shot repair workflow"
          git push
