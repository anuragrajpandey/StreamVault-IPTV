name: One Shot Repair

on:
  push:
    branches:
      - master

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair progressive onboarding synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sync = Path('data/src/main/java/com/streamvault/data/sync/SyncManager.kt')
          s = sync.read_text()
          pattern = re.compile(r'''(?ms)(    \): com\.streamvault\.domain\.model\.Result<Unit>) = withProviderLock\(providerId\) lock@\{\n        if \(trackInitialLiveOnboarding\) \{\n            return@lock awaitInitialCatalog\(.*?        \}\n\n        var progressSession''')
          match = pattern.search(s)
          if not match:
              raise SystemExit('SyncManager wrapper pattern not found')
          replacement = '''\1 {\n        if (trackInitialLiveOnboarding) {\n            return awaitInitialCatalog(\n                providerId = providerId,\n                force = force,\n                movieFastSyncOverride = movieFastSyncOverride,\n                epgSyncModeOverride = epgSyncModeOverride,\n                onProgress = onProgress,\n                trackInitialLiveOnboarding = trackInitialLiveOnboarding,\n                providerOverride = providerOverride,\n                afterCatalogApply = afterCatalogApply\n            )\n        }\n\n        return withProviderLock(providerId) lock@{\n        var progressSession'''
          s = s[:match.start()] + match.expand(replacement) + s[match.end():]
          start = s.index('override suspend fun syncWithProviderOverride')
          end = s.index('\n    fun resetState', start)
          segment = s[start:end]
          stripped = segment.rstrip()
          if not stripped.endswith('    }'):
              raise SystemExit('SyncManager function closing brace not found')
          segment = stripped[:-5] + '    }\n    }'
          s = s[:start] + segment + s[end:]
          sync.write_text(s)

          reg = Path('data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt')
          reg.write_text('''package com.streamvault.data.sync

import java.util.concurrent.ConcurrentHashMap

internal object InitialCatalogCallbackRegistry {
    private val callbacks = ConcurrentHashMap<Long, suspend () -> Unit>()

    fun register(providerId: Long, callback: suspend () -> Unit) { callbacks[providerId] = callback }
    fun take(providerId: Long): (suspend () -> Unit)? = callbacks.remove(providerId)
    fun clear(providerId: Long) { callbacks.remove(providerId) }
}
''')

          strategy = Path('data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt')
          s = strategy.read_text()
          target = 'if (trackInitialLiveOnboarding && staged.acceptedCount > 0 && !initialCatalogCommitted) {'
          replacement = '''val initialCatalogCallback = if (trackInitialLiveOnboarding) InitialCatalogCallbackRegistry.take(provider.id) else null
            if (initialCatalogCallback != null && staged.acceptedCount > 0 && !initialCatalogCommitted) {'''
          if s.count(target) != 2:
              raise SystemExit(f'Expected 2 onboarding strategy guards, found {s.count(target)}')
          s = s.replace(target, replacement)
          old_callback = 'afterCatalogApply = InitialCatalogCallbackRegistry.take(provider.id)'
          if s.count(old_callback) != 2:
              raise SystemExit(f'Expected 2 callback arguments, found {s.count(old_callback)}')
          s = s.replace(old_callback, 'afterCatalogApply = initialCatalogCallback')
          strategy.write_text(s)
          print('Progressive onboarding repair applied')
          PY
      - name: Compile and run focused data tests
        run: ./gradlew --console=plain :data:testDebugUnitTest --tests 'com.streamvault.data.sync.SyncManagerTest' --tests 'com.streamvault.data.sync.SyncManagerXtreamLiveStrategyTest'
      - name: Commit repair and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/src/main/java/com/streamvault/data/sync/SyncManager.kt data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt
          git commit -m "fix: release provider lock before progressive onboarding"
          git rm .github/workflows/one-shot-repair.yml
          git commit -m "chore: remove one-shot repair workflow"
          git push
