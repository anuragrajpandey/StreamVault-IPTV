name: EliteStocks TV Cleanup

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to clean up and verify'
        required: true
        default: 'elitestocks-tv-feature-cleanup'
        type: string

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m

jobs:
  cleanup-and-verify:
    name: EliteStocks TV cleanup & verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run TV cleanup
        run: python3 scripts/final_tv_cleanup_v3.py

      - name: Verify source changes
        run: |
          set -euo pipefail
          git diff --check
          ./gradlew :domain:compileKotlin :data:compileDebugKotlin :player:compileDebugKotlin :app:compileDebugKotlin --no-daemon --parallel --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --parallel --stacktrace

      - name: Commit verified changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'refactor: complete EliteStocks TV cleanup'
            git push origin HEAD:${{ inputs.target_branch }}
          fi
