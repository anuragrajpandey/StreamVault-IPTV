name: Progressive Onboarding Repair Final

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fix
        if: ${{ !contains(github.event.head_commit.message, 'isolate progressive onboarding') }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout f58066d876fa08db0b27503376d8546eb79be600 -- data/src/main/java/com/streamvault/data/sync/SyncManager.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('data/src/main/java/com/streamvault/data/sync/SyncManager.kt')
          s=p.read_text()
          old='''    ): com.streamvault.domain.model.Result<Unit> = withProviderLock(providerId) lock@{
        if (trackInitialLiveOnboarding) {
            return@lock awaitInitialCatalog(
                providerId = providerId,
                force = force,
                movieFastSyncOverride = movieFastSyncOverride,
                epgSyncModeOverride = epgSyncModeOverride,
                onProgress = onProgress,
                trackInitialLiveOnboarding = trackInitialLiveOnboarding,
                providerOverride = providerOverride,
                afterCatalogApply = afterCatalogApply
            )
        }

        var progressSession: SyncProgressSession? = null'''
          new='''    ): com.streamvault.domain.model.Result<Unit> {
        if (trackInitialLiveOnboarding && afterCatalogApply != null) {
            return awaitInitialCatalog(
                providerId = providerId,
                force = force,
                movieFastSyncOverride = movieFastSyncOverride,
                epgSyncModeOverride = epgSyncModeOverride,
                onProgress = onProgress,
                trackInitialLiveOnboarding = trackInitialLiveOnboarding,
                providerOverride = providerOverride,
                afterCatalogApply = afterCatalogApply
            )
        }

        return withProviderLock(providerId) lock@{
        var progressSession: SyncProgressSession? = null'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old2='''        }
    }

    fun resetState'''
          new2='''        }
        }
    }

    fun resetState'''
          assert s.count(old2)==1, s.count(old2)
          p.write_text(s.replace(old2,new2,1))
          p=Path('data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt')
          s=p.read_text()
          old='fun take(providerId: Long): suspend () -> Unit = callbacks.remove(providerId) ?: {}'
          new='fun take(providerId: Long): (suspend () -> Unit)? = callbacks.remove(providerId)'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          p=Path('data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt')
          s=p.read_text()
          guard='if (trackInitialLiveOnboarding && staged.acceptedCount > 0 && !initialCatalogCommitted) {'
          cb='afterCatalogApply = InitialCatalogCallbackRegistry.take(provider.id)'
          assert s.count(guard)==2, s.count(guard)
          assert s.count(cb)==2, s.count(cb)
          s=s.replace(guard,'val initialCatalogCallback = if (trackInitialLiveOnboarding) InitialCatalogCallbackRegistry.take(provider.id) else null\n            if (initialCatalogCallback != null && staged.acceptedCount > 0 && !initialCatalogCommitted) {',2)
          s=s.replace(cb,'afterCatalogApply = initialCatalogCallback',2)
          p.write_text(s)
          PY
          ./gradlew --console=plain :data:testDebugUnitTest --tests 'com.streamvault.data.sync.SyncManagerTest' --tests 'com.streamvault.data.sync.SyncManagerXtreamLiveStrategyTest'
          ./gradlew --console=plain :app:assembleDebug

      - name: Commit fixed source and remove repair workflows
        if: ${{ !contains(github.event.head_commit.message, 'isolate progressive onboarding') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/src/main/java/com/streamvault/data/sync/SyncManager.kt data/src/main/java/com/streamvault/data/sync/InitialCatalogCallbackRegistry.kt data/src/main/java/com/streamvault/data/sync/SyncManagerXtreamLiveStrategy.kt
          git commit -m 'fix: isolate progressive onboarding from provider lock'
          git push
