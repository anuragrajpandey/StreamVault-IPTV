name: EliteStocks TV final validation

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply complete TV cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app/src/main'), Path('app/src/test'), Path('app/src/androidTest'), Path('data/src/main'), Path('data/src/test'), Path('domain/src/main'), Path('domain/src/test'), Path('player/src/main')]
          exact = {
            'PlayerCastCoordinator.kt','PlayerRecordingCoordinator.kt','PlayerResumePrompt.kt',
            'CastMediaRequestFactory.kt','CastManager.kt','CastModels.kt','CastPlaybackCoordinator.kt','CastRouteChooserActivity.kt','CastUiMessages.kt','StreamVaultCastOptionsProvider.kt','CastModule.kt',
            'DownloadForegroundService.kt','DownloadManagerImpl.kt','DownloadManager.kt','DownloadsScreen.kt','DownloadsUiState.kt','DownloadsViewModel.kt',
            'BackupFileBridge.kt','BackupManager.kt','BackupManagerImpl.kt','BackupRestoreStatusStoreImpl.kt','PendingBackupRestoreCoordinator.kt','ExportBackup.kt','ImportBackup.kt',
            'RecordingManager.kt','RecordingManagerImpl.kt','RecordingModels.kt','ScheduleRecording.kt','DownloadTransferStateMachine.kt',
            'BackupRestoreCheckpointDao.kt','BackupRestoreLedgerDao.kt','BackupRestoreLedgerEntities.kt','RecordingDaos.kt','RecordingEntities.kt','RecordingConflictDetector.kt',
            'RecordingAlarmScheduler.kt','RecordingAlarmReceiver.kt','RecordingCaptureEngine.kt','RecordingForegroundIdleGate.kt','RecordingForegroundService.kt','RecordingReconcileWorker.kt','RecordingRestoreReceiver.kt','RecordingServiceLauncher.kt','RecordingSourceResolver.kt','RecordingSupport.kt'
          }
          for root in roots:
            if root.exists():
              for p in root.rglob('*.kt'):
                if p.name in exact: p.unlink()

          for d in [Path('app/src/main/java/com/streamvault/app/cast'), Path('app/src/main/java/com/streamvault/app/backup'), Path('app/src/main/java/com/streamvault/app/ui/screens/downloads')]:
            if d.exists():
              for p in sorted(d.rglob('*'), reverse=True):
                if p.is_file(): p.unlink()
                elif p.is_dir(): p.rmdir()
              d.rmdir()

          drive = Path('domain/src/main/java/com/streamvault/domain/manager/DriveBackupSyncManager.kt')
          if drive.exists(): drive.unlink()

          p = Path('app/src/main/java/com/streamvault/app/ui/screens/player/PlayerViewModel.kt')
          if p.exists():
            s=p.read_text()
            s=s.replace('    internal val _resumePrompt = MutableStateFlow(ResumePromptState())\n\n','')
            s=s.replace('        observeCastPlaybackEvents()\n','')
            s=re.sub(r'(?ms)^\s*viewModelScope\.launch \{\n\s*playerRecordingCoordinator\.observeRecordingItems\(\).*?^\s*\}\n(?=\s*viewModelScope\.launch)', '\n', s, count=1)
            p.write_text(s)

          # Never audit this workflow file. Only source trees are inspected.
          forbidden = ['PlayerResumePrompt','PlayerCastCoordinator','PlayerRecordingCoordinator','CastMediaRequestFactory','CastPlaybackCoordinator','CastRouteChooserActivity','DownloadForegroundService','DriveBackupSyncManager','RecordingAlarmScheduler','startManualRecording','stopCurrentRecording','scheduleDailyRecording','scheduleWeeklyRecording','castCurrentMedia','stopCasting','enterPlayerPictureInPictureModeIfEligible','enterPlayerPictureInPictureModeFromPlayer','updatePlayerPictureInPictureState','clearPlayerPictureInPictureState']
          files=[]
          for root in roots:
            if root.exists(): files.extend(root.rglob('*.kt'))
          for symbol in forbidden:
            for f in files:
              text=f.read_text(errors='ignore')
              if symbol in text: raise RuntimeError(f'forbidden symbol remains: {symbol} in {f}')
          PY
          git diff --check
      - name: Build and test once
        run: ./gradlew :domain:compileDebugKotlin :data:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Final residual audit
        run: |
          set -euo pipefail
          ! git grep -n -E 'com\.streamvault\.app\.cast|PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|DownloadForegroundService|DriveBackupSyncManager|RecordingAlarmScheduler|startManualRecording|stopCurrentRecording|scheduleDailyRecording|scheduleWeeklyRecording|castCurrentMedia|stopCasting|enterPlayerPictureInPictureModeIfEligible|enterPlayerPictureInPictureModeFromPlayer|updatePlayerPictureInPictureState|clearPlayerPictureInPictureState' -- 'app/src/main/**/*.kt' 'data/src/main/**/*.kt' 'domain/src/main/**/*.kt' 'player/src/main/**/*.kt'
      - name: Commit final cleanup
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete EliteStocks TV cleanup [skip ci]' || exit 0
          git push
