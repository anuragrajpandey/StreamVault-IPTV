name: EliteStocks TV final validation

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hardened TV cleanup
        shell: bash
        run: |
          set -euo pipefail
          BASE=a4e690bed7ff51587a59318c0b31f5ce8d73734d
          git restore --source="$BASE" -- app data domain player gradle/libs.versions.toml
          python3 scripts/final_tv_cleanup.py
          git diff --check

      - name: Build and test once
        run: ./gradlew :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Final residual audit
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|DownloadManager|PendingBackupRestoreCoordinator|BackupManager|RecordingManager|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|DownloadDao|DownloadEntity|RecordingRunEntity|RecordingScheduleEntity|RecordingStorageEntity|BackupRestoreCheckpointDao|BackupRestoreLedgerDao' -- 'app/src' 'data/src' 'domain/src' 'player/src' ':!data/src/main/java/com/streamvault/data/local/FeatureMigrationsV49To75.kt'; then
            echo 'Forbidden TV feature symbol remains in source.'
            exit 1
          fi
          test ! -d app/src/main/java/com/streamvault/app/cast
          test ! -d app/src/main/java/com/streamvault/app/backup
          test ! -d app/src/main/java/com/streamvault/app/ui/screens/downloads
          echo 'TV cleanup residual audit passed.'

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f scripts/final_tv_cleanup.py 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'refactor: complete EliteStocks TV cleanup [skip ci]'
            git push origin HEAD:elitestocks-tv-feature-cleanup
          fi
