name: EliteStocks TV final validation

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply complete TV cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def remove_imports(text, needles):
              for needle in needles:
                  text = re.sub(r'^import .*' + re.escape(needle) + r'.*\n', '', text, flags=re.M)
              return text

          def remove_balanced(text, marker, start_at=0):
              idx = text.find(marker, start_at)
              if idx < 0:
                  return text, False
              brace = text.find('{', idx)
              if brace < 0:
                  end = text.find('\n', idx)
                  return text[:idx] + (text[end + 1:] if end >= 0 else ''), True
              depth = 0
              in_str = False
              esc = False
              for i in range(brace, len(text)):
                  c = text[i]
                  if in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == '"': in_str = False
                      continue
                  if c == '"': in_str = True
                  elif c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          if end < len(text) and text[end] == ',': end += 1
                          if end < len(text) and text[end] == '\n': end += 1
                          return text[:idx] + text[end:], True
              raise RuntimeError(f'unclosed block: {marker}')

          def remove_named_arg(text, name):
              pat = re.compile(r'(?m)^(\s*)' + re.escape(name) + r'\s*=')
              while True:
                  m = pat.search(text)
                  if not m: break
                  start = m.start(); i = m.end(); par = brk = brc = 0; in_str = False; esc = False
                  while i < len(text):
                      c = text[i]
                      if in_str:
                          if esc: esc = False
                          elif c == '\\': esc = True
                          elif c == '"': in_str = False
                      else:
                          if c == '"': in_str = True
                          elif c == '(': par += 1
                          elif c == ')': par -= 1
                          elif c == '[': brk += 1
                          elif c == ']': brk -= 1
                          elif c == '{': brc += 1
                          elif c == '}': brc -= 1
                          elif c == ',' and par == 0 and brk == 0 and brc == 0:
                              i += 1
                              if i < len(text) and text[i] == '\n': i += 1
                              text = text[:start] + text[i:]
                              break
                      i += 1
                  else:
                      text = text[:start] + text[i:]
          
          def remove_call_containing(text, needles, call='TvButton('):
              pos = 0
              while True:
                  idx = text.find(call, pos)
                  if idx < 0: return text
                  depth = 0; in_str = False; esc = False; end = None
                  for i in range(idx, len(text)):
                      c = text[i]
                      if in_str:
                          if esc: esc = False
                          elif c == '\\': esc = True
                          elif c == '"': in_str = False
                          continue
                      if c == '"': in_str = True
                      elif c == '(': depth += 1
                      elif c == ')':
                          depth -= 1
                          if depth == 0: end = i + 1; break
                  if end is None: raise RuntimeError('unclosed call')
                  chunk = text[idx:end]
                  if any(n in chunk for n in needles):
                      line_start = text.rfind('\n', 0, idx) + 1
                      text = text[:line_start] + text[end:]
                      pos = line_start
                  else: pos = end

          roots = [Path('app/src/main'), Path('app/src/test'), Path('app/src/androidTest'), Path('data/src/main'), Path('data/src/test'), Path('domain/src/main'), Path('domain/src/test'), Path('player/src/main')]
          exact_names = {
              'PlayerCastCoordinator.kt','PlayerRecordingCoordinator.kt','PlayerResumePrompt.kt','PlayerViewModelActions.kt',
              'CastMediaRequestFactory.kt','CastManager.kt','CastModels.kt','CastPlaybackCoordinator.kt','CastRouteChooserActivity.kt','CastUiMessages.kt','StreamVaultCastOptionsProvider.kt','CastModule.kt',
              'DownloadForegroundService.kt','DownloadManagerImpl.kt','DownloadManager.kt','DownloadsScreen.kt','DownloadsUiState.kt','DownloadsViewModel.kt',
              'BackupFileBridge.kt','BackupManager.kt','BackupManagerImpl.kt','BackupRestoreStatusStoreImpl.kt','PendingBackupRestoreCoordinator.kt','ExportBackup.kt','ImportBackup.kt',
              'RecordingManager.kt','RecordingManagerImpl.kt','RecordingModels.kt','ScheduleRecording.kt','DownloadTransferStateMachine.kt',
              'BackupRestoreCheckpointDao.kt','BackupRestoreLedgerDao.kt','BackupRestoreLedgerEntities.kt','RecordingDaos.kt','RecordingEntities.kt','RecordingConflictDetector.kt',
              'RecordingAlarmScheduler.kt','RecordingAlarmReceiver.kt','RecordingCaptureEngine.kt','RecordingForegroundIdleGate.kt','RecordingForegroundService.kt','RecordingReconcileWorker.kt','RecordingRestoreReceiver.kt','RecordingServiceLauncher.kt','RecordingSourceResolver.kt','RecordingSupport.kt'
          }
          for root in roots:
              if root.exists():
                  for p in root.rglob('*.kt'):
                      if p.name in exact_names: p.unlink()
          for d in [Path('app/src/main/java/com/streamvault/app/cast'),Path('app/src/main/java/com/streamvault/app/backup'),Path('app/src/main/java/com/streamvault/app/ui/screens/downloads')]:
              if d.exists():
                  for p in sorted(d.rglob('*'), reverse=True):
                      if p.is_file(): p.unlink()
                      elif p.is_dir(): p.rmdir()
                  d.rmdir()

          drive = Path('domain/src/main/java/com/streamvault/domain/manager/DriveBackupSyncManager.kt')
          if drive.exists(): drive.unlink()
          creds = Path('domain/src/main/java/com/streamvault/domain/manager/ProviderCredentials.kt')
          if not creds.exists():
              creds.write_text('package com.streamvault.domain.manager\n\nimport com.streamvault.domain.model.ProviderType\n\ndata class ProviderCredentials(\n    val serverUrl: String,\n    val username: String,\n    val password: String,\n    val providerType: ProviderType? = null,\n)\n')

          p = Path('app/src/main/java/com/streamvault/app/ui/screens/player/PlayerScreen.kt')
          s = p.read_text()
          s = remove_imports(s, ['MainActivity','rememberNotificationPermissionGate','PlayerResumePrompt'])
          s = re.sub(r'\n\s*val mainActivity = LocalContext\.current\.findMainActivity\(\).*?(?=\n\s*val playerEngine by)', '\n', s, flags=re.S)
          for marker in ['    val castConnectionState by viewModel.castConnectionState.collectAsStateWithLifecycle()','    val currentChannelRecording by viewModel.currentChannelRecording.collectAsStateWithLifecycle()','    val resumePrompt by viewModel.resumePrompt.collectAsStateWithLifecycle()','    val currentPictureInPictureMode by rememberUpdatedState(isInPictureInPictureMode)','    val enterPictureInPicture = remember(mainActivity)']:
              s,_=remove_balanced(s,marker)
          for marker in ['    val isInPictureInPictureMode =','    val notificationPermissionGate = rememberNotificationPermissionGate(','    LaunchedEffect(mainActivity, streamUrl, playbackState','    LaunchedEffect(isInPictureInPictureMode)','    DisposableEffect(mainActivity)','    if (currentChannelRecording?.status ==','    PlayerResumePrompt(']:
              s,_=remove_balanced(s,marker)
          for name in ['onStartRecording','onStopRecording','onScheduleRecording','onScheduleDailyRecording','onScheduleWeeklyRecording','onEnterPictureInPicture','isCastConnected','onCast','onStopCasting']:
              remove_named_arg(s,name)
          s=s.replace('!isInPictureInPictureMode && ','')
          s=re.sub(r'^import .*com\.streamvault\.app\.ui\.notifications\..*\n','',s,flags=re.M)
          p.write_text(s)

          p=Path('app/src/main/java/com/streamvault/app/MainActivity.kt'); s=p.read_text()
          s=s.replace('import android.util.Rational\n','')
          s=re.sub(r'\n\s*private const val MAX_PIP_ASPECT_RATIO.*?\n\s*private const val MIN_PIP_ASPECT_RATIO.*?\n','\n',s,flags=re.S)
          s=re.sub(r'\n\s*private data class PlayerPictureInPictureState\(.*?\n\s*\}\n','\n',s,flags=re.S)
          s=re.sub(r'\n\s*private val _pictureInPictureModeFlow.*?\n\s*private val _externalNavigationRequestFlow','\n    private val _externalNavigationRequestFlow',s,flags=re.S)
          s=re.sub(r'\n\s*private var playerPictureInPictureState.*?\n','\n',s)
          s=s.replace('        _pictureInPictureModeFlow.value = isInPictureInPictureMode\n','')
          for marker in ['    override fun onUserLeaveHint()','    override fun onPictureInPictureModeChanged(','    fun updatePlayerPictureInPictureState(','    fun clearPlayerPictureInPictureState()','    fun enterPlayerPictureInPictureModeFromPlayer()','    private fun enterPlayerPictureInPictureModeIfEligible(','    private fun applyPlayerPictureInPictureParams()','    private fun videoAspectRatioOrNull(','    private fun supportsPictureInPicture()','    private object PictureInPictureCompat']:
              s,_=remove_balanced(s,marker)
          p.write_text(s)

          p=Path('app/src/main/java/com/streamvault/app/ui/screens/player/PlayerViewModel.kt'); s=p.read_text()
          s=s.replace('    internal val _resumePrompt = MutableStateFlow(ResumePromptState())\n\n','')
          s=s.replace('        observeCastPlaybackEvents()\n','')
          s,_=remove_balanced(s,'        viewModelScope.launch {\n            playerRecordingCoordinator.observeRecordingItems()')
          s,_=remove_balanced(s,'    internal fun refreshCurrentChannelRecording(')
          marker='                // Check for resume position after the player is fully prepared (VOD only).'
          idx=s.find(marker)
          if idx>=0:
              start=s.find('                if (showResumePrompt && currentContentType != ContentType.LIVE',idx)
              if start<0: raise RuntimeError('resume block missing')
              s2,_=remove_balanced(s,'                if (showResumePrompt && currentContentType != ContentType.LIVE',start)
              seek='''                if (currentContentType != ContentType.LIVE && currentContentId != -1L && currentProviderId != -1L) {\n                    val history = playbackHistoryCoordinator.getPlaybackHistory(\n                        contentId = currentContentId,\n                        contentType = currentContentType,\n                        providerId = currentProviderId,\n                        seriesId = currentSeriesId,\n                        seasonNumber = currentSeasonNumber,\n                        episodeNumber = currentEpisodeNumber\n                    )\n                    if (isActivePlaybackSession(requestVersion, playbackLogicalUrl) &&\n                        history != null && history.resumePositionMs > 5_000L &&\n                        !isPlaybackComplete(history.resumePositionMs, history.totalDurationMs)\n                    ) {\n                        playerEngine.seekTo(history.resumePositionMs)\n                    }\n                }\n'''
              s=s2[:idx]+seek+s2[s2.find('\n',idx)+1:]
          p.write_text(s)

          for path in [Path('app/src/main/java/com/streamvault/app/ui/screens/movies/MovieDetailScreen.kt'),Path('app/src/main/java/com/streamvault/app/ui/screens/series/SeriesDetailScreen.kt')]:
              if not path.exists(): continue
              s=path.read_text(); s=remove_imports(s,['CastUiEvent','MainActivity'])
              s,_=remove_balanced(s,'    LaunchedEffect(viewModel, context, mainActivity)')
              s=remove_call_containing(s,['R.string.cast_','R.string.download_button_label'])
              for name in ['onCastResumeEpisode','onCastEpisode','onCast','onDownload','isCasting']:
                  remove_named_arg(s,name)
              s=re.sub(r'^\s*(?:isCasting|onCastResumeEpisode|onCastEpisode|onCast|onDownload)\s*:\s*[^,\n]+,?\s*\n','',s,flags=re.M)
              s=re.sub(r'^\s*val isCasting\s*=.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*val mainActivity\s*=.*\n','',s,flags=re.M)
              path.write_text(s)

          # Existing episode progress is retained; add equivalent movie progress to poster cards.
          p=Path('app/src/main/java/com/streamvault/app/ui/components/shell/AppMediaCards.kt'); s=p.read_text()
          old='''fun MoviePosterCard(movie: Movie, modifier: Modifier = Modifier) {\n    PosterCard(\n        imageUrl = movie.posterUrl,\n        title = movie.name,\n        subtitle = movie.year,\n        modifier = modifier\n    )\n}'''
          new='''fun MoviePosterCard(movie: Movie, modifier: Modifier = Modifier) {\n    val durationMs = movie.durationSeconds.toLong() * 1000L\n    val showProgress = movie.watchProgress > 5000L && durationMs > 0L &&\n        !isPlaybackComplete(movie.watchProgress, durationMs)\n    Box(modifier = modifier) {\n        PosterCard(imageUrl = movie.posterUrl, title = movie.name, subtitle = movie.year, modifier = Modifier.fillMaxSize())\n        if (showProgress) {\n            LinearProgressIndicator(\n                progress = { (movie.watchProgress.toFloat() / durationMs).coerceIn(0f,1f) },\n                modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().padding(horizontal=8.dp,vertical=6.dp).height(3.dp),\n                color = AppColors.Brand, trackColor = AppColors.SurfaceEmphasis\n            )\n        }\n    }\n}'''
          if old in s: s=s.replace(old,new)
          p.write_text(s)

          for path in [Path('app/build.gradle.kts'),Path('gradle/libs.versions.toml')]:
              if path.exists():
                  t=path.read_text(); t=re.sub(r'^.*(?:play\.services\.cast|cast\.framework).*\n','',t,flags=re.M); path.write_text(t)

          p=Path('data/src/main/java/com/streamvault/data/local/StreamVaultDatabase.kt')
          if p.exists():
              s=p.read_text()
              for token in ['RecordingScheduleEntity::class,','RecordingRunEntity::class,','RecordingStorageEntity::class,','DownloadEntity::class,','BackupRestoreCheckpointEntity::class,','BackupRestoreJobEntity::class,','BackupRestoreItemEntity::class,']: s=s.replace(token,'')
              for token in ['    abstract fun recordingScheduleDao(): RecordingScheduleDao\n','    abstract fun recordingRunDao(): RecordingRunDao\n','    abstract fun recordingStorageDao(): RecordingStorageDao\n','    abstract fun downloadDao(): DownloadDao\n','    abstract fun backupRestoreCheckpointDao(): BackupRestoreCheckpointDao\n','    abstract fun backupRestoreLedgerDao(): BackupRestoreLedgerDao\n']: s=s.replace(token,'')
              p.write_text(s)

          for root in roots:
              if not root.exists(): continue
              for f in root.rglob('*.kt'):
                  s=f.read_text(); old=s
                  s=re.sub(r'^import .*com\.streamvault\.app\.cast\..*\n','',s,flags=re.M)
                  s=re.sub(r'^import .*com\.streamvault\.domain\.manager\.(BackupManager|RecordingManager|DownloadManager).*\n','',s,flags=re.M)
                  s=re.sub(r'^import .*com\.streamvault\.domain\.usecase\.(ExportBackup|ImportBackup|ScheduleRecording).*\n','',s,flags=re.M)
                  if s!=old: f.write_text(s)

          for root in [Path('app/src/test'),Path('app/src/androidTest'),Path('data/src/test'),Path('domain/src/test')]:
              if root.exists():
                  for f in root.rglob('*.kt'):
                      if any(x in f.name.lower() for x in ('cast','download','recording','backup')): f.unlink()

          forbidden=['PlayerResumePrompt','PlayerCastCoordinator','PlayerRecordingCoordinator','CastMediaRequestFactory','CastPlaybackCoordinator','CastRouteChooserActivity','DownloadForegroundService','DriveBackupSyncManager','RecordingAlarmScheduler','startManualRecording','stopCurrentRecording','scheduleDailyRecording','scheduleWeeklyRecording','castCurrentMedia','stopCasting','enterPlayerPictureInPictureModeIfEligible','enterPlayerPictureInPictureModeFromPlayer','updatePlayerPictureInPictureState','clearPlayerPictureInPictureState']
          allkt=subprocess.run(['git','grep','-n','--','*.kt'],text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL).stdout
          for symbol in forbidden:
              hits='\n'.join(x for x in allkt.splitlines() if symbol in x)
              if hits: raise RuntimeError(f'forbidden symbol remains: {symbol}\n{hits[:4000]}')
          PY
          git diff --check

      - name: Build and test once
        run: ./gradlew :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Final residual audit
        run: |
          set -euo pipefail
          ! git grep -n -E 'com\.streamvault\.app\.cast|PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|DownloadForegroundService|DriveBackupSyncManager|RecordingAlarmScheduler|startManualRecording|stopCurrentRecording|scheduleDailyRecording|scheduleWeeklyRecording|castCurrentMedia|stopCasting|enterPlayerPictureInPictureModeIfEligible|enterPlayerPictureInPictureModeFromPlayer|updatePlayerPictureInPictureState|clearPlayerPictureInPictureState' -- '*.kt'

      - name: Commit final cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/feature-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete EliteStocks TV cleanup [skip ci]'
          git push
