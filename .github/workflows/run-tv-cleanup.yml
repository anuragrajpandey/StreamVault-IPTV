name: Run coordinated TV cleanup

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'data/**'
      - 'domain/**'
      - 'player/**'
      - 'gradle/**'
      - 'scripts/apply_tv_cleanup.py'
      - '.github/workflows/run-tv-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elitestocks-tv-feature-cleanup
          fetch-depth: 1
      - name: Apply codemod
        run: python3 scripts/apply_tv_cleanup.py
      - name: Remove remaining backup and recording sources
        run: |
          find domain/src/main/java/com/streamvault/domain/usecase -type f \( -iname '*backup*.kt' -o -iname '*recording*.kt' \) -delete 2>/dev/null || true
          find domain/src/main/java/com/streamvault/domain/model -maxdepth 1 -type f \( -iname '*backup*.kt' -o -iname '*recording*.kt' \) -delete 2>/dev/null || true
          find data/src/main/java/com/streamvault/data/manager -type f -iname '*RecordingAlarmScheduler*.kt' -delete 2>/dev/null || true
          provider_repo='data/src/main/java/com/streamvault/data/repository/ProviderRepositoryImpl.kt'
          if [ -f "$provider_repo" ]; then
            sed -i '/import .*RecordingAlarmScheduler/d' "$provider_repo"
            sed -i '/private val recordingAlarmScheduler: RecordingAlarmScheduler,/d' "$provider_repo"
            sed -i '/private val recordingRunDao: RecordingRunDao,/d' "$provider_repo"
            sed -i '/val estimatedRecordingRunIds = recordingRunDao\.getIdsByProvider(id)/d' "$provider_repo"
            sed -i '/const val ALARM_STEP_WEIGHT = 5/d' "$provider_repo"
            sed -i '/(estimatedRecordingRunIds.size + estimatedReminderIds.size) \* ALARM_STEP_WEIGHT +/d' "$provider_repo"
            sed -i '/val recordingRunIds = recordingRunDao\.getIdsByProvider(id)/d' "$provider_repo"
            sed -i '/recordingRunIds\.map { ProviderDeletionCleanupEntity(id = 0, providerId = id, action = ProviderDeletionCleanupWorker.RECORDING_ALARM, targetId = it) } +/d' "$provider_repo"
          fi
          database='data/src/main/java/com/streamvault/data/local/StreamVaultDatabase.kt'
          if [ -f "$database" ]; then
            sed -i '/RecordingScheduleEntity::class/d' "$database"
            sed -i '/RecordingRunEntity::class/d' "$database"
            sed -i '/RecordingStorageEntity::class/d' "$database"
          fi
      - name: Check diff
        run: git diff --check
      - name: Compile app
        id: build
        continue-on-error: true
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Commit cleanup
        if: steps.build.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply_tv_cleanup.py .github/workflows/run-tv-cleanup.yml .github/workflows/cleanup-step.yml
          git add -A
          git commit -m 'refactor: streamline EliteStocks TV features [skip ci]'
          git push origin HEAD:elitestocks-tv-feature-cleanup
      - name: Build failure
        if: steps.build.outcome != 'success'
        run: |
          echo 'Cleanup codemod was not committed because compilation failed.'
          exit 1
