name: EliteStocks TV Final Polish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "EliteStocks TV final polish runner is active"
          test -f app/build.gradle.kts
          test -f app/src/main/res/drawable/EliteStocksTV.png || test -f app/src/main/res/drawable/elitestocks_tv_logo.png
