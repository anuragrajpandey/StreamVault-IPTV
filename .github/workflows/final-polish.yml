name: EliteStocks TV Final Polish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply EliteStocks TV final product polish
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('.')

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          # Use the uploaded EliteStocksTV.png everywhere as the visible launcher artwork.
          src = root / 'app/src/main/res/drawable/EliteStocksTV.png'
          dst = root / 'app/src/main/res/drawable/elitestocks_tv_logo.png'
          if src.exists():
              shutil.copyfile(src, dst)
              src.unlink()
          if dst.exists():
              for p in root.glob('app/src/main/res/mipmap-*/ic_launcher_vault.png'):
                  shutil.copyfile(dst, p)

          manifest = root / 'app/src/main/AndroidManifest.xml'
          if manifest.exists():
              s = text(manifest)
              s = re.sub(r'android:icon="@[^"]+"', 'android:icon="@drawable/elitestocks_tv_logo"', s)
              s = re.sub(r'android:roundIcon="@[^"]+"', 'android:roundIcon="@drawable/elitestocks_tv_logo"', s)
              write(manifest, s)

          adaptive = root / 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_vault.xml'
          if adaptive.exists():
              write(adaptive, '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@drawable/elitestocks_tv_logo"/>
          </adaptive-icon>
          ''')

          # Never expose a Debug suffix in the app label.
          debug_strings = root / 'app/src/debug/res/values/strings.xml'
          if debug_strings.exists():
              write(debug_strings, text(debug_strings).replace('EliteStocks TV Debug', 'EliteStocks TV'))
          gradle = root / 'app/build.gradle.kts'
          write(gradle, text(gradle).replace('            versionNameSuffix = "-debug"\n', ''))

          # Make the player use the new Netflix-style VOD chrome instead of the legacy VOD panel.
          chrome = root / 'app/src/main/java/com/streamvault/app/ui/screens/player/overlay/PlayerControlsChrome.kt'
          s = text(chrome)
          old = re.search(r'''                } else \{\n                    PlayerVodInfo\(.*?\n                    \)\n                \}\n            \}\n        \}\n    \}\n\}''', s, re.S)
          if old:
              modern = '''                } else {
                    PlayerModernVodInfo(
                        title = title,
                        contentType = contentType,
                        isPlaying = isPlaying,
                        currentPosition = currentPosition,
                        duration = duration,
                        aspectRatioLabel = aspectRatioLabel,
                        subtitleTrackCount = subtitleTrackCount,
                        audioTrackCount = audioTrackCount,
                        videoQualityCount = videoQualityCount,
                        isMuted = isMuted,
                        playbackSpeed = playbackSpeed,
                        sleepTimerUiState = sleepTimerUiState,
                        audioVideoSyncEnabled = audioVideoSyncEnabled,
                        playButtonFocusRequester = playButtonFocusRequester,
                        quickActionsFocusRequester = quickActionsFocusRequester,
                        onSeekToPosition = onSeekToPosition,
                        onSetScrubbingMode = onSetScrubbingMode,
                        onToggleAspectRatio = onToggleAspectRatio,
                        onOpenSubtitleTracks = onOpenSubtitleTracks,
                        onOpenAudioTracks = onOpenAudioTracks,
                        onOpenVideoTracks = onOpenVideoTracks,
                        onOpenPlaybackSpeed = onOpenPlaybackSpeed,
                        onOpenStopPlaybackTimer = onOpenStopPlaybackTimer,
                        onOpenIdleStandbyTimer = onOpenIdleStandbyTimer,
                        onOpenAudioVideoSync = onOpenAudioVideoSync,
                        showEpisodesAction = showEpisodesAction,
                        onOpenEpisodes = onOpenEpisodes,
                        showNextEpisodeAction = false,
                        onPlayNextEpisode = {},
                        onEnterPictureInPicture = onEnterPictureInPicture,
                        onToggleMute = onToggleMute,
                        isCastConnected = isCastConnected,
                        onCast = onCast,
                        onStopCasting = onStopCasting,
                        onTogglePlayPause = onTogglePlayPause,
                        onSeekBackward = onSeekBackward,
                        onSeekForward = onSeekForward,
                        seekPreview = seekPreview,
                        onSeekPreviewPositionChanged = onSeekPreviewPositionChanged,
                        showExternalPlayerAction = showExternalPlayerAction,
                        onOpenExternalPlayer = onOpenExternalPlayer
                    )
                }
            }
        }
    }
}'''
              s = s[:old.start()] + modern + s[old.end():]
          elif 'PlayerModernVodInfo(' not in s:
              raise SystemExit('Could not locate legacy VOD chrome block')
          write(chrome, s)

          # Keep only Xtream and M3U URL on the provider source picker.
          provider = root / 'app/src/main/java/com/streamvault/app/ui/screens/provider/ProviderSetupScreen.kt'
          s = text(provider)
          panel = re.search(r'@Composable\nprivate fun SourceTypeSelectorPanel\(.*?\n\}\n\n@Composable\nprivate fun SourceTypeCard', s, re.S)
          if panel:
              replacement = '''@Composable
          private fun SourceTypeSelectorPanel(
              sourceType: SourceType,
              isEditing: Boolean,
              isEditLabel: String,
              onSelect: (SourceType) -> Unit,
              onImportClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              Surface(
                  modifier = modifier,
                  shape = RoundedCornerShape(20.dp),
                  colors = SurfaceDefaults.colors(containerColor = Surface.copy(alpha = 0.92f))
              ) {
                  Column(
                      modifier = Modifier.fillMaxSize().padding(14.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Text(text = isEditLabel, style = MaterialTheme.typography.titleMedium, color = TextPrimary)
                      Text(text = stringResource(R.string.setup_shell_subtitle), style = MaterialTheme.typography.bodySmall, color = OnSurfaceDim)
                      Text(text = stringResource(R.string.setup_source_type_label), style = MaterialTheme.typography.labelSmall, color = TextTertiary)
                      if (!isEditing || sourceType == SourceType.XTREAM) {
                          SourceTypeCard(
                              title = stringResource(R.string.setup_xtream),
                              subtitle = stringResource(R.string.setup_info_xtream_body),
                              selected = sourceType == SourceType.XTREAM,
                              enabled = !isEditing,
                              onClick = { onSelect(SourceType.XTREAM) }
                          )
                      }
                      if (!isEditing || sourceType == SourceType.M3U_URL) {
                          SourceTypeCard(
                              title = stringResource(R.string.setup_tab_url),
                              subtitle = stringResource(R.string.setup_info_m3u_body),
                              selected = sourceType == SourceType.M3U_URL,
                              enabled = !isEditing,
                              onClick = { onSelect(SourceType.M3U_URL) }
                          )
                      }
                      if (!isEditing) {
                          ImportOptionsButton(
                              text = stringResource(R.string.settings_restore_data),
                              onClick = onImportClick,
                              compact = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                      Spacer(modifier = Modifier.weight(1f))
                      Text(text = stringResource(R.string.setup_info_manage_title), style = MaterialTheme.typography.bodySmall, color = OnSurfaceDim)
                      Text(text = stringResource(R.string.setup_info_manage_body), style = MaterialTheme.typography.bodySmall, color = OnSurfaceDim.copy(alpha = 0.55f))
                  }
              }
          }

          @Composable
          private fun SourceTypeCard'''
              s = s[:panel.start()] + replacement + s[panel.end():]
          tabs = re.search(r'@Composable\nprivate fun SourceTypeTabRow\(.*?\n\}\n\n// ??? ProviderTextField', s, re.S)
          if tabs:
              replacement = '''@Composable
          private fun SourceTypeTabRow(
              sourceType: SourceType,
              isEditing: Boolean,
              onSelect: (SourceType) -> Unit,
              modifier: Modifier = Modifier
          ) {
              Row(modifier = modifier, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  if (!isEditing || sourceType == SourceType.XTREAM) {
                      TabButton(
                          text = stringResource(R.string.setup_xtream),
                          isSelected = sourceType == SourceType.XTREAM,
                          onClick = { if (!isEditing) onSelect(SourceType.XTREAM) }
                      )
                  }
                  if (!isEditing || sourceType == SourceType.M3U_URL) {
                      TabButton(
                          text = stringResource(R.string.setup_tab_url),
                          isSelected = sourceType == SourceType.M3U_URL,
                          onClick = { if (!isEditing) onSelect(SourceType.M3U_URL) }
                      )
                  }
              }
          }

          // ??? ProviderTextField'''
              s = s[:tabs.start()] + replacement + s[tabs.end():]
          write(provider, s)

          # Remove Guide and Plugins from the main navigation menu while keeping internal routes/code intact.
          shell = root / 'app/src/main/java/com/streamvault/app/ui/components/shell/AppShell.kt'
          s = text(shell)
          s = s.replace(
              'AppTopLevelDestination.defaultOrder.map { it.toDestinationItem() }',
              'AppTopLevelDestination.defaultOrder.filterNot { it == AppTopLevelDestination.GUIDE || it == AppTopLevelDestination.PLUGINS }.map { it.toDestinationItem() }'
          )
          s = s.replace(
              'configured.map { it.toDestinationItem() }',
              'configured.filterNot { it == AppTopLevelDestination.GUIDE || it == AppTopLevelDestination.PLUGINS }.map { it.toDestinationItem() }'
          )
          write(shell, s)

          # About page: no update controls, no build verification, no GitHub/Ko-fi actions.
          about = root / 'app/src/main/java/com/streamvault/app/ui/screens/settings/SettingsBackupAboutSections.kt'
          s = text(about)
          start = s.find('internal fun LazyListScope.settingsAboutSection(')
          if start >= 0:
              s = s[:start] + '''internal fun LazyListScope.settingsAboutSection(
              uiState: SettingsUiState,
              context: Context,
              buildVerificationLabel: String,
              onOpenUri: (String) -> Unit,
              onCheckForUpdates: () -> Unit,
              onInstallDownloadedUpdate: () -> Unit,
              onDownloadLatestUpdate: () -> Unit,
              onSetAutoCheckAppUpdates: (Boolean) -> Unit,
              onSetAutoDownloadAppUpdates: (Boolean) -> Unit,
              onRefreshDownloadState: () -> Unit,
              onViewCrashReport: () -> Unit,
              onShareCrashReport: () -> Unit,
              onDeleteCrashReport: () -> Unit
          ) {
              item {
                  Column(
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      SettingsSectionHeader(
                          title = stringResource(R.string.settings_about),
                          subtitle = "EliteStocks TV"
                      )
                      SettingsRow(
                          label = stringResource(R.string.settings_app_version),
                          value = "${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})"
                      )
                      SettingsRow(
                          label = stringResource(R.string.settings_developed_by),
                          value = "EliteStocks"
                      )
                  }
              }
          }
          '''
          write(about, s)

          # Stop the legacy update worker from being scheduled, and cancel any old queued work on upgrade.
          startup = root / 'app/src/main/java/com/streamvault/app/StartupWorkRegistry.kt'
          s = text(startup)
          s = re.sub(r'import com\.streamvault\.app\.update\.AppUpdateCheckWorker\n', '', s)
          s = re.sub(r'\n\s*AppUpdateCheckWorker\.enqueue\(context\)\n', '\n        WorkManager.getInstance(context).cancelUniqueWork("app-update-check")\n', s)
          write(startup, s)

          # Remove crash-report sharing from app startup/DB failure UI.
          app = root / 'app/src/main/java/com/streamvault/app/StreamVaultApp.kt'
          s = text(app).replace('import com.streamvault.app.diagnostics.CrashReportStore\n', '').replace('        CrashReportStore.install(this)\n', '')
          write(app, s)

          main = root / 'app/src/main/java/com/streamvault/app/MainActivity.kt'
          s = text(main).replace('import com.streamvault.app.diagnostics.CrashReportStore\n', '')
          s = re.sub(r'\n    private fun shareLatestFailureReport\(\) \{.*?\n    \}\n', '\n', s, flags=re.S)
          s = s.replace('                            onShareReport = ::shareLatestFailureReport\n', '')
          s = s.replace('    onShareReport: () -> Unit = {}\n', '')
          s = re.sub(r'\n\s*Button\(onClick = onShareReport\) \{ Text\("Share report"\) \}', '', s)
          write(main, s)

          # Remove LeakCanary completely.
          app_gradle = root / 'app/build.gradle.kts'
          write(app_gradle, text(app_gradle).replace('    debugImplementation(libs.leakcanary.android)\n', ''))
          catalog = root / 'gradle/libs.versions.toml'
          s = text(catalog)
          s = re.sub(r'leakcanary = "[^"]+"\n', '', s)
          s = re.sub(r'leakcanary-android = \{[^\n]+\}\n', '', s)
          write(catalog, s)

          # Remove crash-report actions from the settings UI wiring, but leave old ViewModel plumbing unreachable.
          settings = root / 'app/src/main/java/com/streamvault/app/ui/screens/settings/SettingsScreen.kt'
          s = text(settings).replace('import com.streamvault.app.diagnostics.CrashReportStore\n', '')
          s = re.sub(r'\n    fun shareCrashReport\(\) \{.*?\n    \}\n', '\n', s, flags=re.S)
          s = re.sub(
              r'\n\s*onViewCrashReport = viewModel::viewCrashReport,\n\s*onShareCrashReport = ::shareCrashReport,\n\s*onDeleteCrashReport = viewModel::deleteCrashReport,',
              '\n                    onViewCrashReport = {},\n                    onShareCrashReport = {},\n                    onDeleteCrashReport = {},',
              s
          )
          write(settings, s)

          # Faster VOD startup and lower memory pressure on budget TVs.
          buffers = root / 'player/src/main/java/com/streamvault/player/playback/PlaybackBufferPolicies.kt'
          s = text(buffers)
          for a, b in {
              'LOW_MEMORY_VOD_MIN_BUFFER_MS = 15_000': 'LOW_MEMORY_VOD_MIN_BUFFER_MS = 8_000',
              'LOW_MEMORY_VOD_MAX_BUFFER_MS = 45_000': 'LOW_MEMORY_VOD_MAX_BUFFER_MS = 30_000',
              'LOW_MEMORY_REBUFFER_MS = 3_000': 'LOW_MEMORY_REBUFFER_MS = 2_500',
              'VOD_MIN_BUFFER_MS = 90_000': 'VOD_MIN_BUFFER_MS = 20_000',
              'VOD_MAX_BUFFER_MS = 240_000': 'VOD_MAX_BUFFER_MS = 90_000',
              'VOD_PLAYBACK_BUFFER_MS = 8_000': 'VOD_PLAYBACK_BUFFER_MS = 2_500',
              'VOD_REBUFFER_MS = 18_000': 'VOD_REBUFFER_MS = 4_000'
          }.items():
              s = s.replace(a, b)
          write(buffers, s)

          # Reduce avoidable image animation work on lower-end hardware.
          app = root / 'app/src/main/java/com/streamvault/app/StreamVaultApp.kt'
          write(app, text(app).replace('.crossfade(!isReducedMotionEnabled(context))', '.crossfade(false)'))

          # About branding.
          strings = root / 'app/src/main/res/values/strings.xml'
          s = text(strings)
          s = re.sub(r'<string name="settings_developer_name">.*?</string>', '<string name="settings_developer_name">EliteStocks</string>', s)
          write(strings, s)
          PY

      - name: Verify forbidden UI/features are gone
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E 'EliteStocks TV Debug|Share report|settings_github|settings_donate|settings_build_verification' -- app/src/main || true
          ! git grep -n 'AppUpdateCheckWorker.enqueue' -- app/src/main || true
          ! git grep -n 'leakcanary' -- app gradle || true

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew :player:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit final polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "feat: final EliteStocks TV product polish"
          git push
