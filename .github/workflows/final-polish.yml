name: EliteStocks TV Final Polish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final product changes
        run: python3 tools/final_polish.py

      - name: Test and build
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :player:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "GRADLE_EXIT_CODE=$status" >> build.log
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocks-TV-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocks-TV-final-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit final changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: final EliteStocks TV product polish"
            git push
          fi
