name: EliteStocks TV final cleanup v7

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]

permissions:
  contents: write

jobs:
  final-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dependency-safe cleanup
        run: |
          set -euo pipefail
          git restore --source=55cd29e5cd20ac57ab98d4b625e7da63d5ca5ec1 -- app data domain player gradle/libs.versions.toml
          python3 scripts/final_tv_cleanup_v3.py
          rm -f domain/src/main/java/com/streamvault/domain/model/DownloadModels.kt
          python3 - <<'PY'
          from pathlib import Path
          import re

          f=Path('data/src/main/java/com/streamvault/data/local/entity/RecordingEntities.kt')
          if f.exists():
              s=f.read_text(); marker='@Entity(\n    tableName = "program_reminders"'; p=s.find(marker)
              header=''.join(x for x in s[:p].splitlines(True) if x.startswith('package ') or x.startswith('import '))+'\n'
              m=re.search(r'(?ms)^@Entity\(\s*tableName = "program_reminders".*?^data class ProgramReminderEntity\(.*?^\)\s*$', s[p:])
              if not m: raise SystemExit('ProgramReminderEntity block missing')
              f.write_text(header+m.group(0).rstrip()+'\n')

          for name in ['ProgramReminderAlarmReceiver.kt','ProgramReminderRestoreReceiver.kt']:
              f=Path('data/src/main/java/com/streamvault/data/manager/reminder')/name
              if f.exists():
                  s=f.read_text()
                  if 'BroadcastReceiver' in s and 'import android.content.BroadcastReceiver' not in s:
                      s=s.replace('\n\n','\n\nimport android.content.BroadcastReceiver\n',1); f.write_text(s)

          f=Path('data/src/main/java/com/streamvault/data/repository/ProviderDeletionCleanupWorker.kt')
          if f.exists():
              s=f.read_text()
              while 'ProviderDeletionCleanupEntity.RECORDING_ALARM' in s:
                  p=s.find('ProviderDeletionCleanupEntity.RECORDING_ALARM'); start=s.rfind('\n',0,p)+1; depth=0; started=False; end=start
                  for line in s[start:].splitlines(True):
                      depth += line.count('{')-line.count('}'); end += len(line)
                      if '{' in line: started=True
                      if started and depth==0: break
                  s=s[:start]+s[end:]
              s=re.sub(r'^\s*const val RECORDING_ALARM.*$', '', s, flags=re.M)
              s=re.sub(r'^\s*fun recordingAlarmScheduler\(\):.*$', '', s, flags=re.M)
              s=s.replace('cancelRecordingAlarm = entry.recordingAlarmScheduler()::cancel,\n','')
              f.write_text(s)

          f=Path('data/src/main/java/com/streamvault/data/repository/ProviderRepositoryImpl.kt')
          if f.exists():
              s=f.read_text()
              s=re.sub(r'^\s*val estimatedRecordingRunIds\s*=.*$', '', s, flags=re.M)
              s=s.replace('                (estimatedRecordingRunIds.size + estimatedReminderIds.size) * ALARM_STEP_WEIGHT +\n','')
              s=re.sub(r'^\s*val recordingRunIds\s*=.*$', '', s, flags=re.M)
              s=re.sub(r'(?s)recordingRunIds\.map \{.*?\}\s*\+\s*', '', s, count=1)
              s=re.sub(r'^\s*private const val ALARM_STEP_WEIGHT.*$', '', s, flags=re.M)
              f.write_text(s)

          f=Path('data/src/main/java/com/streamvault/data/sync/SyncManager.kt')
          if f.exists():
              s=f.read_text()
              s=re.sub(r'(?ms)^\s*requiredHiddenCategoryIds = \{ providerId, type ->.*?^\s*\}\n', '', s)
              s=re.sub(r'(?ms)^\s*val requiredHiddenIds = pendingBackupRestoreCoordinator.*?^\s*\.orEmpty\(\)\n', '', s)
              s=s.replace('category.categoryId in hiddenCategoryIds && category.categoryId !in requiredHiddenIds','category.categoryId in hiddenCategoryIds')
              f.write_text(s)

          f=Path('data/src/main/java/com/streamvault/data/local/StreamVaultDatabase.kt')
          if f.exists():
              s=f.read_text()
              for name in ['RecordingScheduleEntity','RecordingRunEntity','RecordingStorageEntity','DownloadEntity','BackupRestoreCheckpointEntity','BackupRestoreJobEntity','BackupRestoreItemEntity']:
                  s=re.sub(r'^\s*'+name+r'::class,?\s*$', '', s, flags=re.M)
              f.write_text(s)

          # Normalize every transformed Kotlin file to one trailing newline.
          for root in [Path('app/src'),Path('data/src'),Path('domain/src'),Path('player/src')]:
              for p in root.rglob('*.kt'):
                  s=p.read_text(errors='ignore').rstrip()+'\n'
                  p.write_text(s)
          PY
          git diff --check

      - name: Build and test once
        run: ./gradlew :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Final residual audit
        run: |
          set -euo pipefail
          if git grep -n -E 'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|RecordingAlarmScheduler|RecordingManager|DownloadDao|DownloadEntity|DownloadStatus|DownloadItem|DownloadRequest|DownloadContentType|PendingBackupRestoreCoordinator|BackupManagerImpl|BackupFileBridge|BackupRestore|GoogleDriveBackupSyncManager|DriveBackupSyncManager' -- 'app/src' 'data/src' 'domain/src' 'player/src'; then exit 1; fi
          test ! -d app/src/main/java/com/streamvault/app/cast
          test ! -d app/src/main/java/com/streamvault/app/backup
          test ! -d app/src/main/java/com/streamvault/app/ui/screens/downloads
          test ! -f domain/src/main/java/com/streamvault/domain/model/DownloadModels.kt
          echo 'Final TV cleanup audit passed.'

      - name: Commit final cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f scripts/final_tv_cleanup.py scripts/final_tv_cleanup_v3.py 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No source changes to commit.'; else git commit -m 'refactor: complete EliteStocks TV cleanup [skip ci]'; git push origin HEAD:elitestocks-tv-feature-cleanup; fi
