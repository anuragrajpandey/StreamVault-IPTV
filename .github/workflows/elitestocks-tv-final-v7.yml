name: EliteStocks TV final cleanup v7

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]

permissions:
  contents: write

jobs:
  final-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dependency-safe cleanup
        run: |
          set -euo pipefail
          git restore --source=55cd29e5cd20ac57ab98d4b625e7da63d5ca5ec1 -- app data domain player gradle/libs.versions.toml
          python3 scripts/final_tv_cleanup_v3.py
          rm -f domain/src/main/java/com/streamvault/domain/model/DownloadModels.kt

          cat > domain/src/main/java/com/streamvault/domain/manager/ProviderCredentials.kt <<'EOF'
          package com.streamvault.domain.manager

          import com.streamvault.domain.model.ProviderType

          data class ProviderCredentials(
              val serverUrl: String,
              val username: String,
              val password: String,
              val providerType: ProviderType? = null,
          )
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          def write_clean(path, text):
              Path(path).write_text(text.rstrip() + '\n')

          f=Path('data/src/main/java/com/streamvault/data/local/entity/RecordingEntities.kt')
          if f.exists():
              s=f.read_text()
              marker='@Entity(\n    tableName = "program_reminders"'
              p=s.find(marker)
              if p < 0: raise SystemExit('ProgramReminderEntity marker missing')
              header=''.join(x for x in s[:p].splitlines(True) if x.startswith('package ') or x.startswith('import '))
              m=re.search(r'(?ms)^@Entity\(\s*tableName = "program_reminders".*?^data class ProgramReminderEntity\(.*?^\)\s*$', s[p:])
              if not m: raise SystemExit('ProgramReminderEntity block missing')
              write_clean(f, header + m.group(0))

          for name in ['ProgramReminderAlarmReceiver.kt','ProgramReminderRestoreReceiver.kt']:
              f=Path('data/src/main/java/com/streamvault/data/manager/reminder')/name
              if f.exists():
                  s=f.read_text()
                  if 'BroadcastReceiver' in s and 'import android.content.BroadcastReceiver' not in s:
                      s=s.replace('\n\n','\n\nimport android.content.BroadcastReceiver\n',1)
                  write_clean(f,s)

          f=Path('data/src/main/java/com/streamvault/data/repository/ProviderDeletionCleanupWorker.kt')
          if f.exists():
              s=f.read_text()
              s=re.sub(r'^import .*RecordingAlarmScheduler.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*fun recordingAlarmScheduler\(\):.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*const val RECORDING_ALARM\s*=.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*cancelRecordingAlarm\s*=.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*ProviderDeletionCleanupWorker\.RECORDING_ALARM\s*->.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*cancelRecordingAlarm:\s*\(String\)\s*->\s*Unit,\s*\n','',s,flags=re.M)
              write_clean(f,s)

          f=Path('data/src/main/java/com/streamvault/data/repository/ProviderRepositoryImpl.kt')
          if f.exists():
              s=f.read_text()
              s=re.sub(r'^import .*RecordingAlarmScheduler.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*val estimatedRecordingRunIds\s*=.*\n','',s,flags=re.M)
              s=s.replace('                (estimatedRecordingRunIds.size + estimatedReminderIds.size) * ALARM_STEP_WEIGHT +\n','')
              s=re.sub(r'^\s*val recordingRunIds\s*=.*\n','',s,flags=re.M)
              s=re.sub(r'(?ms)providerDeletionCleanupDao\.insertAll\(\s*recordingRunIds\.map \{.*?\}\s*\+\s*reminderIds\.map', 'providerDeletionCleanupDao.insertAll(\n                    reminderIds.map', s, count=1)
              s=re.sub(r'(?ms)^\s*recordingRunIds\.map \{.*?^\s*\}\s*\+\s*','',s,count=1)
              s=re.sub(r'^\s*private const val ALARM_STEP_WEIGHT.*\n','',s,flags=re.M)
              write_clean(f,s)

          f=Path('data/src/main/java/com/streamvault/data/sync/SyncManager.kt')
          if f.exists():
              s=f.read_text()
              s=re.sub(r'^import .*PendingBackupRestoreCoordinator.*\n','',s,flags=re.M)
              s=re.sub(r'^\s*private val pendingBackupRestoreCoordinator: PendingBackupRestoreCoordinator\? = null,?\n','',s,flags=re.M)
              # Replace the entire category-visibility helper with the normal hidden-category behavior.
              pattern=r'(?ms)    private suspend fun allVisibleStalkerIndexCategories\(.*?^    private suspend fun visibleStalkerIndexCategories\('
              replacement='''    private suspend fun allVisibleStalkerIndexCategories(\n        providerId: Long,\n        contentType: ContentType,\n        categories: List<CategoryEntity>\n    ): List<CategoryEntity> {\n        val hiddenCategoryIds = preferencesRepository.getHiddenCategoryIds(providerId, contentType).first()\n        return categories.filterNot { category ->\n            category.categoryId in hiddenCategoryIds\n        }\n    }\n\n    private suspend fun visibleStalkerIndexCategories('''
              s2=re.sub(pattern,replacement,s,count=1)
              if s2 == s: raise SystemExit('Could not normalize allVisibleStalkerIndexCategories')
              s=s2
              write_clean(f,s)

          f=Path('data/src/main/java/com/streamvault/data/local/StreamVaultDatabase.kt')
          if f.exists():
              s=f.read_text()
              for name in ['RecordingScheduleEntity','RecordingRunEntity','RecordingStorageEntity','DownloadEntity','BackupRestoreCheckpointEntity','BackupRestoreJobEntity','BackupRestoreItemEntity']:
                  s=re.sub(r'^\s*'+name+r'::class,?\s*$','',s,flags=re.M)
              write_clean(f,s)

          for root in [Path('app/src'),Path('data/src'),Path('domain/src'),Path('player/src')]:
              for p in root.rglob('*.kt'):
                  write_clean(p,p.read_text(errors='ignore'))
          PY
          git diff --check

      - name: Build and test once
        run: ./gradlew :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Final residual audit
        run: |
          set -euo pipefail
          if git grep -n -E 'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|RecordingAlarmScheduler|RecordingManager|DownloadDao|DownloadEntity|DownloadStatus|DownloadItem|DownloadRequest|DownloadContentType|PendingBackupRestoreCoordinator|BackupManagerImpl|BackupFileBridge|BackupRestore|GoogleDriveBackupSyncManager|DriveBackupSyncManager|requiredHiddenCategoryIds|requiredHiddenIds' -- 'app/src' 'data/src' 'domain/src' 'player/src'; then exit 1; fi
          test ! -d app/src/main/java/com/streamvault/app/cast
          test ! -d app/src/main/java/com/streamvault/app/backup
          test ! -d app/src/main/java/com/streamvault/app/ui/screens/downloads
          test ! -f domain/src/main/java/com/streamvault/domain/model/DownloadModels.kt
          test -f domain/src/main/java/com/streamvault/domain/manager/ProviderCredentials.kt
          echo 'Final TV cleanup audit passed.'

      - name: Commit final cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add -A
          git rm -f scripts/final_tv_cleanup.py scripts/final_tv_cleanup_v3.py 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No source changes to commit.'; else git commit -m 'refactor: complete EliteStocks TV cleanup [skip ci]'; git push origin HEAD:elitestocks-tv-feature-cleanup; fi
