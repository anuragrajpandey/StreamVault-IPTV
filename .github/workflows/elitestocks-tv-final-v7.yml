name: EliteStocks TV final cleanup v7

on:
  push:
    branches: [elitestocks-tv-feature-cleanup]

permissions:
  contents: write

jobs:
  final-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dependency-safe cleanup
        run: |
          set -euo pipefail
          git restore --source=55cd29e5cd20ac57ab98d4b625e7da63d5ca5ec1 -- app data domain player gradle/libs.versions.toml
          python3 scripts/final_tv_cleanup_v3.py
          rm -f domain/src/main/java/com/streamvault/domain/model/DownloadModels.kt

          cat > domain/src/main/java/com/streamvault/domain/manager/ProviderCredentials.kt <<'EOF'
          package com.streamvault.domain.manager

          import com.streamvault.domain.model.ProviderType

          data class ProviderCredentials(
              val serverUrl: String,
              val username: String,
              val password: String,
              val providerType: ProviderType? = null,
          )
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          def write_clean(path, text):
              Path(path).write_text(text.rstrip() + '\n')

          def remove_block(text, marker):
              pos = text.find(marker)
              if pos < 0:
                  return text
              start = text.rfind('\n', 0, pos) + 1
              depth = 0
              started = False
              end = start
              for line in text[start:].splitlines(True):
                  depth += line.count('{') - line.count('}')
                  end += len(line)
                  if '{' in line:
                      started = True
                  if started and depth == 0:
                      return text[:start] + text[end:]
              return text

          exact_types = [
              'DownloadManager', 'BackupManager', 'ScheduleRecording', 'ImportBackup',
              'CastManager', 'CastMediaRequestFactory', 'CastPlaybackCoordinator',
              'CastPlaybackReportMode', 'CastUiEvent', 'CastStartResult', 'CastMediaRequest',
              'CastPlaybackEvent', 'CastRouteChooserActivity', 'DownloadForegroundService',
              'RecordingManager', 'RecordingRecurrence', 'RecordingStatus', 'RecordingItem',
              'RecordingRequest', 'RecordingConflictInfo', 'BackupConflictStrategy',
              'BackupRestoreOutcome', 'DriveAuthState', 'DriveBackupSnapshot',
              'BackupImportPlan', 'BackupPreview', 'ImportBackupCommand', 'ImportBackupResult',
              'InspectBackupCommand', 'InspectBackupResult', 'ExportBackup', 'ExportBackupCommand',
              'ExportBackupResult', 'ScheduleRecordingCommand'
          ]
          lower_vars = [
              'downloadManager', 'backupManager', 'exportBackup', 'importBackup',
              'backupActions', 'driveBackupActions', 'backupRestoreStatusStore',
              'recordingManager', 'recordingActions', 'scheduleRecording',
              'castManager', 'castMediaRequestFactory', 'castPlaybackCoordinator',
              'castPlaybackReportMode', 'castEvents', 'recordingMessage',
              'pendingRecordingConflict'
          ]

          def strip_dependency_lines(text):
              out = []
              for line in text.splitlines(True):
                  if any(re.search(r'\b' + re.escape(t) + r'\b', line) for t in exact_types):
                      continue
                  if any(re.search(r'\b' + re.escape(v) + r'\b', line) for v in lower_vars):
                      continue
                  out.append(line)
              return ''.join(out)

          for name in [
              'app/src/main/java/com/streamvault/app/ui/screens/series/SeriesDetailViewModel.kt',
              'app/src/main/java/com/streamvault/app/ui/screens/movies/MovieDetailViewModel.kt',
          ]:
              f = Path(name)
              if f.exists():
                  s = f.read_text()
                  for marker in ['observeCastPlaybackEvents', 'fun sendToCast', 'fun startCast', 'fun stopCast']:
                      s = remove_block(s, marker)
                  s = strip_dependency_lines(s)
                  write_clean(f, s)

          f = Path('app/src/main/java/com/streamvault/app/ui/screens/settings/SettingsViewModel.kt')
          if f.exists():
              s = f.read_text()
              for marker in [
                  'private val exportBackup =', 'private val importBackup =',
                  'private val backupActions =', 'private val driveBackupActions =',
                  'private val recordingActions =', 'driveBackupActions.observeAuthState',
                  'backupRestoreStatusStore.observeRestoreJobs', 'registerRecordingObservers('
              ]:
                  s = remove_block(s, marker)
              for match in list(re.finditer(r'^\s*(?:private |internal |public |override )*(?:suspend )?fun\s+\w*(?:Backup|Restore|Recording)\w*\s*\(', s, re.M)):
                  s = remove_block(s, match.group(0))
              s = strip_dependency_lines(s)
              write_clean(f, s)

          f = Path('app/src/main/java/com/streamvault/app/ui/screens/provider/ProviderSetupViewModel.kt')
          if f.exists():
              s = f.read_text()
              for match in list(re.finditer(r'^\s*(?:private |internal |public |override )*(?:suspend )?fun\s+\w*(?:Backup|Restore|ImportBackup|InspectBackup)\w*\s*\(', s, re.M)):
                  s = remove_block(s, match.group(0))
              s = strip_dependency_lines(s)
              write_clean(f, s)

          f = Path('app/src/main/java/com/streamvault/app/ui/screens/epg/EpgViewModel.kt')
          if f.exists():
              s = f.read_text()
              s = remove_block(s, 'data class RecordingConflictInfo')
              for match in list(re.finditer(r'^\s*(?:private |internal |public |override )*(?:suspend )?fun\s+\w*(?:Recording|ScheduleRecording)\w*\s*\(', s, re.M)):
                  s = remove_block(s, match.group(0))
              s = strip_dependency_lines(s)
              write_clean(f, s)

          f = Path('app/src/main/java/com/streamvault/app/MainActivity.kt')
          if f.exists():
              s = f.read_text()
              s = strip_dependency_lines(s)
              for marker in ['fun openCastRouteChooser', 'enterPlayerPictureInPictureModeIfEligible', 'fun updatePlayerPictureInPictureState', 'fun clearPlayerPictureInPictureState', 'fun enterPlayerPictureInPictureModeFromPlayer', 'private fun applyPlayerPictureInPictureParams', 'private fun videoAspectRatioOrNull', 'private fun supportsPictureInPicture']:
                  s = remove_block(s, marker)
              s = re.sub(r'^\s*private data class PlayerPictureInPictureState\(.*?^\s*\)\s*\n', '', s, flags=re.S|re.M)
              s = re.sub(r'^\s*private const val MAX_PIP_ASPECT_RATIO.*\n', '', s, flags=re.M)
              s = re.sub(r'^\s*private const val MIN_PIP_ASPECT_RATIO.*\n', '', s, flags=re.M)
              s = re.sub(r'^\s*override fun onUserLeaveHint\(\).*?^\s*\}\s*\n', '', s, flags=re.S|re.M)
              s = re.sub(r'^\s*override fun onPictureInPictureModeChanged\(.*?^\s*\}\s*\n', '', s, flags=re.S|re.M)
              write_clean(f, s)

          for root in [Path('app/src/main'), Path('app/src/test'), Path('app/src/androidTest')]:
              if not root.exists():
                  continue
              for p in root.rglob('*.kt'):
                  s = p.read_text(errors='ignore')
                  for match in list(re.finditer(r'^\s*(?:private |internal |public |override )*(?:suspend )?fun\s+\w*(?:Backup|Restore|Recording|Cast)\w*\s*\(', s, re.M)):
                      s = remove_block(s, match.group(0))
                  s = strip_dependency_lines(s)
                  p.write_text(s.rstrip() + '\n')

          # Keep the reminder feature, but isolate it from the former combined recording files.
          dao = Path('data/src/main/java/com/streamvault/data/local/dao/RecordingDaos.kt')
          if dao.exists():
              s = dao.read_text()
              m = re.search(r'(?ms)^@Dao\s+interface ProgramReminderDao\s*\{.*?^\}', s)
              if not m:
                  raise SystemExit('ProgramReminderDao block missing')
              header = 'package com.streamvault.data.local.dao\n\nimport androidx.room.Dao\nimport androidx.room.Insert\nimport androidx.room.OnConflictStrategy\nimport androidx.room.Query\nimport androidx.room.Update\nimport com.streamvault.data.local.entity.ProgramReminderEntity\nimport com.streamvault.domain.model.ProgramReminderDeliveryState\nimport kotlinx.coroutines.flow.Flow\n\n'
              write_clean('data/src/main/java/com/streamvault/data/local/dao/ProgramReminderDao.kt', header + m.group(0))
              dao.unlink()

          entity = Path('data/src/main/java/com/streamvault/data/local/entity/RecordingEntities.kt')
          if entity.exists():
              s = entity.read_text()
              m = re.search(r'(?ms)^@Entity\(\s*tableName = "program_reminders".*?^data class ProgramReminderEntity\(.*?^\)\s*$', s)
              if not m:
                  raise SystemExit('ProgramReminderEntity block missing')
              header = 'package com.streamvault.data.local.entity\n\nimport androidx.room.ColumnInfo\nimport androidx.room.Entity\nimport androidx.room.ForeignKey\nimport androidx.room.Index\nimport androidx.room.PrimaryKey\nimport com.streamvault.domain.model.ProgramReminderDeliveryState\n\n'
              write_clean('data/src/main/java/com/streamvault/data/local/entity/ProgramReminderEntity.kt', header + m.group(0))
              entity.unlink()

          # Database must retain only the reminder DAO/entity from the old combined files.
          db = Path('data/src/main/java/com/streamvault/data/local/StreamVaultDatabase.kt')
          s = db.read_text()
          for name in ['RecordingScheduleEntity','RecordingRunEntity','RecordingStorageEntity','DownloadEntity','BackupRestoreCheckpointEntity','BackupRestoreJobEntity','BackupRestoreItemEntity']:
              s = re.sub(r'^\s*' + name + r'::class,?\s*$', '', s, flags=re.M)
          for name in ['recordingScheduleDao','recordingRunDao','recordingStorageDao','downloadDao','backupRestoreCheckpointDao','backupRestoreLedgerDao']:
              s = re.sub(r'^\s*abstract fun ' + name + r'\([^\n]*\):[^\n]*$', '', s, flags=re.M)
          write_clean(db, s)
          PY
          git diff --check

      - name: Build and test once
        run: ./gradlew :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Final residual audit
        run: |
          set -euo pipefail
          if git grep -n -E 'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|RecordingAlarmScheduler|RecordingManager|DownloadDao|DownloadEntity|DownloadStatus|DownloadItem|DownloadRequest|DownloadContentType|PendingBackupRestoreCoordinator|BackupManagerImpl|BackupFileBridge|BackupRestore|GoogleDriveBackupSyncManager|DriveBackupSyncManager|requiredHiddenCategoryIds|requiredHiddenIds' -- 'app/src' 'data/src' 'domain/src' 'player/src'; then exit 1; fi
          test ! -d app/src/main/java/com/streamvault/app/cast
          test ! -d app/src/main/java/com/streamvault/app/backup
          test ! -d app/src/main/java/com/streamvault/app/ui/screens/downloads
          test ! -f domain/src/main/java/com/streamvault/domain/model/DownloadModels.kt
          test -f domain/src/main/java/com/streamvault/domain/manager/ProviderCredentials.kt
          echo 'Final TV cleanup audit passed.'

      - name: Commit final cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add -A
          git rm -f scripts/final_tv_cleanup.py scripts/final_tv_cleanup_v3.py 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No source changes to commit.'; else git commit -m 'refactor: complete EliteStocks TV cleanup [skip ci]'; git push origin HEAD:elitestocks-tv-feature-cleanup; fi