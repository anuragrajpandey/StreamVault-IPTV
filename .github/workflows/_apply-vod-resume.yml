name: Apply VOD Resume Once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore: add temporary VOD resume patch helper' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Patch VOD resume behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/streamvault/app/ui/screens/player/PlayerViewModel.kt')
          s = p.read_text(encoding='utf-8')
          old = '''                // Check for resume position after the player is fully prepared (VOD only).\n                // Doing this after preparePlayer ensures pause() acts on the live player instance,\n                // not a stale one that may have already been replaced by prepareInternal().\n                if (showResumePrompt && currentContentType != ContentType.LIVE && currentContentId != -1L && currentProviderId != -1L) {\n                    val history = playbackHistoryCoordinator.getPlaybackHistory(\n                        contentId = currentContentId,\n                        contentType = currentContentType,\n                        providerId = currentProviderId,\n                        seriesId = currentSeriesId,\n                        seasonNumber = currentSeasonNumber,\n                        episodeNumber = currentEpisodeNumber\n                    )\n                    if (isActivePlaybackSession(requestVersion, playbackLogicalUrl)) {\n                        if (history != null && history.resumePositionMs > 5000L && !isPlaybackComplete(history.resumePositionMs, history.totalDurationMs)) {\n                            playerEngine.pause()\n                            _resumePrompt.value = ResumePromptState(\n                                show = true,\n                                positionMs = history.resumePositionMs,\n                                title = currentTitle\n                            )\n                        }\n                    }\n                }\n'''
          new = '''                // Resume VOD automatically from saved progress. No Resume/Start Over prompt.\n                if (showResumePrompt && currentContentType != ContentType.LIVE && currentContentId != -1L && currentProviderId != -1L) {\n                    val history = playbackHistoryCoordinator.getPlaybackHistory(\n                        contentId = currentContentId,\n                        contentType = currentContentType,\n                        providerId = currentProviderId,\n                        seriesId = currentSeriesId,\n                        seasonNumber = currentSeasonNumber,\n                        episodeNumber = currentEpisodeNumber\n                    )\n                    if (isActivePlaybackSession(requestVersion, playbackLogicalUrl)) {\n                        _resumePrompt.value = ResumePromptState()\n                        if (history != null && history.resumePositionMs > 5000L && !isPlaybackComplete(history.resumePositionMs, history.totalDurationMs)) {\n                            playerEngine.seekTo(history.resumePositionMs)\n                        }\n                        playerEngine.play()\n                    }\n                }\n'''
          if old not in s:
              raise SystemExit('Expected VOD resume block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/streamvault/app/ui/screens/player/PlayerViewModel.kt .github/workflows/_apply-vod-resume.yml
          git commit -m 'feat: automatically resume VOD playback'
          git rm .github/workflows/_apply-vod-resume.yml
          git commit -m 'chore: remove temporary VOD resume helper'
          git push origin HEAD:master
