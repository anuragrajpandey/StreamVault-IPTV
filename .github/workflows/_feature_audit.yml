name: Feature Audit Once
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit references
        run: |
          echo '=== DOWNLOADS ==='
          grep -RIn --exclude-dir=.git -E 'DOWNLOADS|Routes\.DOWNLOADS|DownloadScreen|DownloadRepository|DownloadManager' app data domain player 2>/dev/null | head -200 || true
          echo '=== CAST ==='
          grep -RIn --exclude-dir=.git -E 'CastConnectionState|castCurrentMedia|stopCasting|openCastRouteChooser|isCastConnected|onCast|onStopCasting' app data domain player 2>/dev/null | head -250 || true
          echo '=== PIP ==='
          grep -RIn --exclude-dir=.git -E 'PictureInPicture|pictureInPicture|enterPlayerPictureInPicture|updatePlayerPictureInPicture|clearPlayerPictureInPicture|onEnterPictureInPicture' app data domain player 2>/dev/null | head -250 || true
          echo '=== RECORDING ==='
          grep -RIn --exclude-dir=.git -E 'startManualRecording|stopCurrentRecording|scheduleRecording|RecordingStatus|currentChannelRecording|onStartRecording|onStopRecording|onScheduleRecording' app data domain player 2>/dev/null | head -300 || true
          echo '=== RECENT ==='
          grep -RIn --exclude-dir=.git -E 'recentChannels|getRecentlyWatched|RecentlyWatched|recently watched' app/src/main/java/com/streamvault/app/ui/screens/live* app/src/main/java/com/streamvault/app 2>/dev/null | head -250 || true
      - name: Remove audit workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_feature_audit.yml
          git commit -m 'chore: remove feature audit workflow'
          git push
