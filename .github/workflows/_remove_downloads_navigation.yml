name: Remove Downloads Navigation Once
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: add one-time downloads navigation cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Downloads navigation route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/streamvault/app/navigation/AppNavigation.kt')
          s = p.read_text()
          replacements = [
              ('import com.streamvault.app.ui.screens.downloads.DownloadsScreen\n', ''),
              ('    const val DOWNLOADS = "downloads"\n', ''),
              ('    AppLandingDestination.DOWNLOADS -> Routes.DOWNLOADS\n', ''),
              ('    AppTopLevelDestination.DOWNLOADS -> Routes.DOWNLOADS\n', ''),
              ('\n        composable(Routes.DOWNLOADS) {\n            DownloadsScreen(\n                onNavigate = { route -> tabNavigate(route) },\n                currentRoute = Routes.DOWNLOADS\n            )\n        }\n', ''),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1 and old != '    const val DOWNLOADS = "downloads"\n':
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:70]!r}')
              if count == 1:
                  s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -q 'const val DOWNLOADS' app/src/main/java/com/streamvault/app/navigation/AppNavigation.kt && exit 1 || true
          grep -q 'composable(Routes.DOWNLOADS)' app/src/main/java/com/streamvault/app/navigation/AppNavigation.kt && exit 1 || true
      - name: Run navigation tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Commit cleanup and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/streamvault/app/navigation/AppNavigation.kt .github/workflows/_remove_downloads_navigation.yml
          git commit -m 'feat: remove downloads navigation route'
          git rm .github/workflows/_remove_downloads_navigation.yml
          git commit -m 'chore: remove temporary downloads cleanup workflow'
          git push