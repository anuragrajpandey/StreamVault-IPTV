name: EliteStocks TV Feature Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m

jobs:
  cleanup-and-verify:
    name: Cleanup, TV UX fixes & verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: elitestocks-tv-feature-cleanup
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply existing dependency-safe TV cleanup
        run: python3 scripts/final_tv_cleanup_v3.py

      - name: Apply final TV feature, progress and navigation fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text.rstrip() + "\n", encoding="utf-8")

          def remove_block(text, marker):
              while marker in text:
                  pos = text.find(marker)
                  start = text.rfind("\n", 0, pos) + 1
                  depth = 0
                  started = False
                  end = start
                  for line in text[start:].splitlines(True):
                      depth += line.count("{") - line.count("}")
                      end += len(line)
                      if "{" in line:
                          started = True
                      if started and depth == 0:
                          break
                  else:
                      raise RuntimeError(f"Could not remove block: {marker}")
                  text = text[:start] + text[end:]
              return text

          # 1. Movie progress bars: Movie already carries watchProgress, but the
          # card API defaults it to zero. Wire the real progress into every VOD
          # movie card in both modern and classic layouts.
          movie_screen = Path("app/src/main/java/com/streamvault/app/ui/screens/movies/MoviesScreen.kt")
          if movie_screen.exists():
              s = movie_screen.read_text(encoding="utf-8")
              s = re.sub(
                  r'MovieCard\(movie = movie,\s*(?!watchProgress\s*=)',
                  'MovieCard(movie = movie, watchProgress = if (movie.durationSeconds > 0) (movie.watchProgress.toFloat() / (movie.durationSeconds.toFloat() * 1000f)).coerceIn(0f, 1f) else 0f, ',
                  s,
              )
              # Keep TV grids as a single directional focus group so D-pad left/right
              # stays inside the media surface instead of jumping to the shell.
              s = s.replace(
                  'modifier = Modifier.fillMaxSize().onPreviewKeyEvent {',
                  'modifier = Modifier.fillMaxSize().focusGroup().onPreviewKeyEvent {',
              )
              if 'import androidx.compose.foundation.focusGroup' not in s:
                  s = s.replace(
                      'import androidx.compose.foundation.layout.*\n',
                      'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.focusGroup\n',
                      1,
                  )
              write(movie_screen, s)

          # 2. Series episode progress: the Episode card already renders its own
          # progress bar from Episode.watchProgress. Rehydrate that field from the
          # persisted playback history when loading the series detail page.
          series_vm = Path("app/src/main/java/com/streamvault/app/ui/screens/series/SeriesDetailViewModel.kt")
          if series_vm.exists():
              s = series_vm.read_text(encoding="utf-8")
              old = 'loadSeriesDetailsForProvider(effectiveProviderId, seriesId)'
              # The call itself remains unchanged. The enrichment happens inside the
              # success branch so variant/provider resolution stays intact.
              s = s.replace(
                  'val isFavoriteDeferred = viewModelScope.async {\n                        favoriteRepository.isFavorite(providerId, result.data.id, ContentType.SERIES)\n                    }\n                    loadExternalRatings(result.data)\n                    startUnwatchedCountCollection(providerId, result.data.id)',
                  'val enrichedSeries = enrichEpisodeProgress(result.data, providerId)\n                    val isFavoriteDeferred = viewModelScope.async {\n                        favoriteRepository.isFavorite(providerId, enrichedSeries.id, ContentType.SERIES)\n                    }\n                    loadExternalRatings(enrichedSeries)\n                    startUnwatchedCountCollection(providerId, enrichedSeries.id)',
                  1,
              )
              s = s.replace('series = result.data.copy(isFavorite = isFavoriteDeferred.await()),', 'series = enrichedSeries.copy(isFavorite = isFavoriteDeferred.await()),', 1)
              s = s.replace('selectedSeason = result.data.seasons.firstOrNull { season ->', 'selectedSeason = enrichedSeries.seasons.firstOrNull { season ->', 1)
              s = s.replace('} ?: result.data.seasons.firstOrNull(),', '} ?: enrichedSeries.seasons.firstOrNull(),', 1)
              s = s.replace('resumeEpisode = findResumeEpisode(result.data),', 'resumeEpisode = findResumeEpisode(enrichedSeries),', 1)

              marker = '    private fun findResumeEpisode(series: Series): Episode? {'
              helper = '''    private suspend fun enrichEpisodeProgress(series: Series, providerId: Long): Series {
        val histories = playbackHistoryRepository
            .getRecentlyWatchedByProvider(providerId, limit = 1000)
            .first()
            .asSequence()
            .filter { it.contentType == ContentType.SERIES_EPISODE }
            .filter { it.seriesId == series.id || it.seriesId == null }
            .associateBy { it.contentId }

        if (histories.isEmpty()) return series

        return series.copy(
            seasons = series.seasons.map { season ->
                season.copy(
                    episodes = season.episodes.map { episode ->
                        val history = histories[episode.id] ?: return@map episode
                        episode.copy(
                            watchProgress = history.resumePositionMs,
                            lastWatchedAt = history.lastWatchedAt
                        )
                    }
                )
            }
        )
    }

'''
              if marker in s and 'private suspend fun enrichEpisodeProgress' not in s:
                  s = s.replace(marker, helper + marker, 1)
              write(series_vm, s)

          # 3. Make horizontal TV shelves deterministic for D-pad movement and
          # restore focus to the previously selected card when returning to a row.
          category_row = Path("app/src/main/java/com/streamvault/app/ui/components/CategoryRow.kt")
          if category_row.exists():
              s = category_row.read_text(encoding="utf-8")
              if 'import androidx.compose.foundation.focusGroup' not in s:
                  s = s.replace('import androidx.compose.foundation.layout.*\n', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.focusGroup\n', 1)
              s = s.replace('modifier = Modifier.focusRestorer(),', 'modifier = Modifier.focusGroup().focusRestorer(),', 1)
              write(category_row, s)

          for name in [
              "app/src/main/java/com/streamvault/app/ui/screens/series/SeriesScreen.kt",
          ]:
              p = Path(name)
              if p.exists():
                  s = p.read_text(encoding="utf-8")
                  s = s.replace(
                      'modifier = Modifier.fillMaxSize().onPreviewKeyEvent {',
                      'modifier = Modifier.fillMaxSize().focusGroup().onPreviewKeyEvent {',
                  )
                  if 'import androidx.compose.foundation.focusGroup' not in s:
                      s = s.replace('import androidx.compose.foundation.layout.*\n', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.focusGroup\n', 1)
                  write(p, s)

          # 4. The Movies + Series destinations share a VOD rail item. Match both
          # child routes so the active destination is visibly highlighted on TV.
          shell = Path("app/src/main/java/com/streamvault/app/ui/components/shell/AppShell.kt")
          if shell.exists():
              s = shell.read_text(encoding="utf-8")
              s = s.replace(
                  'currentRoute.startsWith(it.route)',
                  '(if (it.route == Routes.VOD) currentRoute.startsWith(Routes.MOVIES) || currentRoute.startsWith(Routes.SERIES) else currentRoute.startsWith(it.route))',
              )
              s = s.replace(
                  'selected = currentRoute.startsWith(item.route),',
                  'selected = if (item.route == Routes.VOD) currentRoute.startsWith(Routes.MOVIES) || currentRoute.startsWith(Routes.SERIES) else currentRoute.startsWith(item.route),',
              )
              write(shell, s)

          # 5. Recent Live TV must only consume LIVE playback history. Some providers
          # write mixed VOD/live history rows; feeding those IDs to the live channel
          # loader makes Recent appear empty or reorder incorrectly.
          roots = [Path("app/src/main"), Path("data/src/main"), Path("domain/src/main"), Path("player/src/main")]
          recent_replacement = '''private fun List<PlaybackHistory>.toRecentLiveContentIds(): List<Long> =
              asSequence()
                  .filter { it.contentType == ContentType.LIVE }
                  .sortedByDescending { it.lastWatchedAt }
                  .map { it.contentId }
                  .distinct()
                  .take(24)
                  .toList()
'''
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*.kt"):
                  s = p.read_text(encoding="utf-8", errors="ignore")
                  marker = 'private fun List<PlaybackHistory>.toRecentLiveContentIds()'
                  if marker not in s:
                      continue
                  start = s.find(marker)
                  brace = s.find('{', start)
                  if brace < 0:
                      continue
                  depth = 0
                  end = brace
                  started = False
                  for line in s[brace:].splitlines(True):
                      depth += line.count('{') - line.count('}')
                      end += len(line)
                      if '{' in line:
                          started = True
                      if started and depth == 0:
                          break
                  else:
                      continue
                  line_start = s.rfind('\n', 0, start) + 1
                  s = s[:line_start] + recent_replacement + s[end:]
                  write(p, s)

          # 6. Downloads must not remain as a TV navigation destination after the
          # feature cleanup. Remove the enum branch/route references conservatively.
          nav_roots = [Path("app/src/main/java/com/streamvault/app")]
          for root in nav_roots:
              for p in root.rglob("*.kt"):
                  s = p.read_text(encoding="utf-8", errors="ignore")
                  old = s
                  s = re.sub(r'^\s*AppTopLevelDestination\.DOWNLOADS\s*->.*\n', '', s, flags=re.M)
                  s = re.sub(r'^\s*DOWNLOADS\s*,?\s*$', '', s, flags=re.M)
                  s = re.sub(r'^\s*const val DOWNLOADS\s*=.*\n', '', s, flags=re.M)
                  s = re.sub(r'^\s*import .*Downloads.*\n', '', s, flags=re.M)
                  if s != old:
                      write(p, s)

          print("Final TV feature patch complete.")

      - name: Audit removed TV features
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'PlayerResumePrompt|PlayerCastCoordinator|PlayerRecordingCoordinator|CastMediaRequestFactory|CastPlaybackCoordinator|CastRouteChooserActivity|DownloadForegroundService|RecordingManager|RecordingRunDao|RecordingScheduleDao|RecordingStorageDao|RecordingAlarmScheduler|BackupManagerImpl|BackupFileBridge|PendingBackupRestoreCoordinator|GoogleDriveBackupSyncManager|DriveBackupSyncManager' -- 'app/src' 'data/src' 'domain/src' 'player/src'; then
            echo 'Removed TV feature symbols still exist.'
            exit 1
          fi
          if git grep -n -E 'PictureInPicture|pictureInPicture|enterPictureInPicture|onEnterPictureInPicture' -- 'app/src' 'player/src'; then
            echo 'PiP references still exist.'
            exit 1
          fi
          test ! -d app/src/main/java/com/streamvault/app/cast
          test ! -d app/src/main/java/com/streamvault/app/backup
          test ! -d app/src/main/java/com/streamvault/app/ui/screens/downloads
          echo 'Feature-removal audit passed.'

      - name: Check formatting and compile
        run: |
          set -euo pipefail
          git diff --check
          ./gradlew :domain:compileKotlin :data:compileDebugKotlin :player:compileDebugKotlin :app:compileDebugKotlin --no-daemon --parallel --stacktrace

      - name: Run unit tests
        run: |
          set -euo pipefail
          ./gradlew :player:testDebugUnitTest :app:testDebugUnitTest --no-daemon --parallel --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --parallel --stacktrace

      - name: Commit cleanup changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'refactor: complete EliteStocks TV feature cleanup'
            git push origin HEAD:elitestocks-tv-feature-cleanup
          fi
